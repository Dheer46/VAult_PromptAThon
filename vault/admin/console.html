<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Vault web console: manage buckets and objects, and monitor the storage cluster, healing, replication and services.">
<title>Vault Console</title>
<style>
/* ---------- design tokens (all text pairs meet WCAG 2.2 AA contrast; UI borders >= 3:1) ---------- */
:root{
  --bg:#f3f5f9;--panel:#ffffff;--panel-2:#f8fafc;--ink:#101828;--muted:#475467;--line:#d8dde6;--ctl:#667085;
  --accent:#1d4ed8;--accent-ink:#ffffff;--accent-soft:#e8efff;--focus:#1d4ed8;
  --ok:#05603a;--ok-bg:#dcfae6;--bad:#b42318;--bad-bg:#fee4e2;--warn:#7a2e0e;--warn-bg:#fef0c7;--info:#1849a9;--info-bg:#e0eaff;
  --chip:#eaecf0;--chip-ink:#344054;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  --radius:14px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--scale:1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme]){
  --bg:#0b0f17;--panel:#121826;--panel-2:#161e2e;--ink:#f2f4f7;--muted:#b3bccb;--line:#2c3547;--ctl:#8591a6;
  --accent:#8ab4ff;--accent-ink:#0b0f17;--accent-soft:#1a2745;--focus:#ffd166;
  --ok:#75e0a7;--ok-bg:#0b2d1e;--bad:#fda29b;--bad-bg:#3b1512;--warn:#fec84b;--warn-bg:#3a2a07;--info:#a4bcfd;--info-bg:#1a2745;
  --chip:#232c3d;--chip-ink:#d0d5dd;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{
  --bg:#0b0f17;--panel:#121826;--panel-2:#161e2e;--ink:#f2f4f7;--muted:#b3bccb;--line:#2c3547;--ctl:#8591a6;
  --accent:#8ab4ff;--accent-ink:#0b0f17;--accent-soft:#1a2745;--focus:#ffd166;
  --ok:#75e0a7;--ok-bg:#0b2d1e;--bad:#fda29b;--bad-bg:#3b1512;--warn:#fec84b;--warn-bg:#3a2a07;--info:#a4bcfd;--info-bg:#1a2745;
  --chip:#232c3d;--chip-ink:#d0d5dd;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35)}
:root[data-theme="contrast"]{
  --bg:#000;--panel:#000;--panel-2:#000;--ink:#fff;--muted:#fff;--line:#fff;--ctl:#fff;
  --accent:#ffff00;--accent-ink:#000;--accent-soft:#000;--focus:#00ffff;
  --ok:#00ff7f;--ok-bg:#000;--bad:#ff6b6b;--bad-bg:#000;--warn:#ffd700;--warn-bg:#000;--info:#9fd3ff;--info-bg:#000;
  --chip:#000;--chip-ink:#fff;--shadow:none}
:root[data-theme="contrast"] .chip,:root[data-theme="contrast"] .card{border:1px solid #fff}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{font-size:calc(16px * var(--scale))}
body{margin:0;font:1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:10px;font-weight:600;text-decoration:none}
.skip:focus{top:12px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}
h1{font-size:1.6rem;line-height:1.25;margin:0}h2{font-size:1.1rem;margin:0 0 .75rem}h3{font-size:.95rem;margin:0 0 .5rem}
p{margin:.25rem 0}
button,.btn{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--ctl);background:var(--panel);color:var(--ink);
  padding:.55rem 1rem;border-radius:10px;min-height:44px;min-width:44px;display:inline-flex;align-items:center;gap:.5rem;text-decoration:none}
button:hover,.btn:hover{background:var(--panel-2)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08);background:var(--accent)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.ghost{border-color:transparent;background:transparent}
button:disabled{opacity:.55;cursor:not-allowed}
input,select{font:inherit;padding:.55rem .75rem;min-height:44px;border:1px solid var(--ctl);border-radius:10px;background:var(--panel);color:var(--ink);min-width:0}
input[aria-invalid="true"]{border-color:var(--bad);border-width:2px}
label{font-weight:600}
.field{display:flex;flex-direction:column;gap:.35rem;min-width:0}
.hint{color:var(--muted);font-size:.875rem;font-weight:400}
.err{color:var(--bad);font-size:.9rem;font-weight:600;min-height:1.2em}
svg.i{width:1.15em;height:1.15em;flex:none}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.app>*{min-width:0} /* let wide tables scroll inside their box instead of widening the page (WCAG 1.4.10) */
.side{background:var(--panel);border-right:1px solid var(--line);padding:1.25rem 1rem;display:flex;flex-direction:column;gap:1rem;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:.65rem;font-weight:800;font-size:1.2rem;letter-spacing:-.01em}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:grid;place-items:center;color:#fff}
.side nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.side nav a{display:flex;align-items:center;gap:.7rem;padding:.6rem .75rem;border-radius:10px;color:var(--ink);text-decoration:none;min-height:44px}
.side nav a:hover{background:var(--panel-2)}
.side nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.navgroup{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:.75rem .75rem .25rem}
.me{margin-top:auto;border-top:1px solid var(--line);padding-top:1rem;display:flex;flex-direction:column;gap:.5rem}
.me .who{display:flex;align-items:center;gap:.6rem}.avatar{width:36px;height:36px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:800}
.top{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;padding:1rem 2rem;border-bottom:1px solid var(--line);background:var(--panel)}
.top .grow{flex:1}
main{padding:1.75rem 2rem 3rem;min-width:0;outline:none}
.page-head{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}.page-head .grow{flex:1;min-width:240px}
.sub{color:var(--muted);margin-top:.35rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));margin-bottom:1rem}
.stat{position:relative;overflow:hidden}
.stat .k{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.stat .v{overflow-wrap:anywhere;font-size:1.9rem;font-weight:800;letter-spacing:-.02em;margin-top:.2rem;font-variant-numeric:tabular-nums}
.stat .note{font-size:.85rem;color:var(--muted)}
.stat::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--accent-soft);opacity:.7}
.stat>*{position:relative;z-index:1}
.row{display:flex;gap:.75rem;align-items:flex-end;flex-wrap:wrap}.row.center{align-items:center}.grow{flex:1}
.tbl{overflow-x:auto;border-radius:10px;position:relative} /* contains .sr-only descendants so they cannot widen the page */
table{width:100%;border-collapse:collapse;min-width:520px}
caption{text-align:left;font-weight:700;padding:0 0 .6rem}
th,td{text-align:left;padding:.7rem .8rem;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;background:var(--panel-2)}
tbody tr:hover{background:var(--panel-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.actions{text-align:right;white-space:nowrap}td.actions>*{margin-left:.35rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.1rem .6rem;border-radius:99px;background:var(--chip);color:var(--chip-ink);font-size:.8rem;font-weight:600;margin:.1rem .25rem .1rem 0;overflow-wrap:anywhere}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.info{background:var(--info-bg);color:var(--info)}
.chip .dot{width:.5rem;height:.5rem;border-radius:50%;background:currentColor}
.mono{font-family:var(--mono);font-size:.875rem;word-break:break-all}
.muted{color:var(--muted)}
.meter{height:.6rem;background:var(--chip);border-radius:99px;overflow:hidden;min-width:80px}
.meter>span{display:block;height:100%;background:var(--accent);border-radius:99px}
:root[data-theme="contrast"] .meter{border:1px solid #fff}
.drives{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr));gap:.6rem;list-style:none;margin:.75rem 0 0;padding:0}
.drive{border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:10px;padding:.6rem .75rem;background:var(--panel-2)}
.drive.bad{border-left-color:var(--bad)}.drive strong{display:block}
.crumbs ol{list-style:none;display:flex;flex-wrap:wrap;gap:.25rem;margin:0;padding:0;align-items:center}
.crumbs li+li::before{content:"/";color:var(--muted);margin-right:.25rem}
.crumbs button{min-height:36px;padding:.2rem .5rem;border:0;background:none;color:var(--accent);text-decoration:underline}
.crumbs [aria-current]{font-weight:700;color:var(--ink);text-decoration:none}
.drop{border:2px dashed var(--ctl);border-radius:var(--radius);padding:1.5rem;text-align:center;color:var(--muted);background:var(--panel)}
.drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.uploads{list-style:none;margin:.75rem 0 0;padding:0;display:grid;gap:.5rem}
.uploads li{display:grid;grid-template-columns:1fr 160px auto;gap:.75rem;align-items:center}
.arch{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:1rem}
.arch ul{list-style:none;margin:0;padding:0;display:grid;gap:.45rem}
.arch li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem;padding:.55rem .75rem;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.empty{padding:1.5rem;text-align:center;color:var(--muted)}
.pill-toggle[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:1.5rem;
  background:radial-gradient(1200px 600px at 10% -10%,var(--accent-soft),transparent),var(--bg)}
.login{width:100%;max-width:440px}
.login .card{padding:2rem}
.login form{display:grid;gap:1rem;margin-top:1.25rem}
.pw{display:flex;gap:.5rem}.pw input{flex:1;min-width:8rem}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--ink);padding:1.5rem;max-width:min(92vw,460px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(3,7,18,.6)}
dialog .row{justify-content:flex-end;margin-top:1.25rem}
.toasts{position:fixed;right:1rem;bottom:1rem;display:grid;gap:.5rem;z-index:50;max-width:min(92vw,380px)}
.toast{padding:.8rem 1rem;border-radius:12px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);font-weight:600;display:flex;gap:.6rem;align-items:flex-start}
.toast.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.settings{display:grid;gap:.75rem}
@media (prefers-reduced-motion:no-preference){:root:not([data-motion="reduce"]) .toast{animation:pop .18s ease-out}
  :root:not([data-motion="reduce"]) .meter>span{transition:width .4s ease}}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (forced-colors:active){.chip,.card,.drive,button{border:1px solid CanvasText}.meter>span{background:Highlight}}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .side nav ul{flex-direction:row;flex-wrap:wrap}.me{margin-top:0}main,.top{padding:1rem}.uploads li{grid-template-columns:1fr}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<div id="root"></div>
<!-- screen reader announcements: polite for status, assertive for errors -->
<div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="alert" class="sr-only" role="alert" aria-atomic="true"></div>
<div class="toasts" aria-hidden="true" id="toasts"></div>
<dialog id="dlg" aria-labelledby="dlg-title" aria-describedby="dlg-body">
  <h2 id="dlg-title">Confirm</h2><p id="dlg-body"></p>
  <div class="row"><button type="button" id="dlg-no">Cancel</button><button type="button" class="primary" id="dlg-yes">Confirm</button></div>
</dialog>
<script>
"use strict";
/* ---------------------------------------------------------------- helpers */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtB = n => { if (n == null) return "–"; const u = ["B","KiB","MiB","GiB","TiB"]; let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; } return (i ? n.toFixed(1) : n) + " " + u[i]; };
const fmtT = t => t ? new Date(t * 1000).toLocaleString() : "–";
const isoT = t => t ? new Date(t * 1000).toISOString() : "";
const q = o => new URLSearchParams(o).toString();
const ICON = {
  bucket:'<path d="M4 7h16l-1.5 12a2 2 0 0 1-2 1.8h-9a2 2 0 0 1-2-1.8L4 7z"/><path d="M3 7c0-1.7 4-3 9-3s9 1.3 9 3"/>',
  files:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  arch:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  server:'<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  heal:'<path d="M12 21s-7-4.4-9.3-9A5 5 0 0 1 12 6a5 5 0 0 1 9.3 6c-2.3 4.6-9.3 9-9.3 9z"/><path d="M12 10v5M9.5 12.5h5"/>',
  repl:'<path d="M4 7h11l-3-3M20 17H9l3 3"/>',
  plug:'<path d="M9 7V3M15 7V3M6 7h12v4a6 6 0 0 1-12 0zM12 17v4"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6 6 0 0 0-4-5.6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  upload:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>', check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
  alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
};
const icon = n => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${ICON[n]||""}</svg>`;
const chip = (text, kind = "", dot = false) => `<span class="chip ${kind}">${dot ? '<span class="dot" aria-hidden="true"></span>' : ""}${esc(text)}</span>`;
const status = ok => ok == null ? chip("Not configured") : ok ? chip("Up", "ok", true) : chip("Down", "bad", true);
const meter = (pct, label) => { const v = Math.max(0, Math.min(100, Math.round(pct))); return `<div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}" aria-label="${esc(label)}" aria-valuetext="${v}%"><span style="width:${v}%"></span></div>`; };

/* --------------------------------------------------- preferences (a11y) */
const PREF_KEY = "vault-console-prefs";
let PREFS = { theme: "system", scale: 1, motion: "system", live: true };
try { Object.assign(PREFS, JSON.parse(localStorage.getItem(PREF_KEY) || "{}")); } catch (e) {}
function applyPrefs() {
  const r = document.documentElement;
  if (PREFS.theme === "system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", PREFS.theme);
  r.style.setProperty("--scale", PREFS.scale);
  if (PREFS.motion === "reduce") r.setAttribute("data-motion", "reduce"); else r.removeAttribute("data-motion");
  try { localStorage.setItem(PREF_KEY, JSON.stringify(PREFS)); } catch (e) {}
}
applyPrefs();

/* ------------------------------------------------ announcements & toasts */
function announce(msg, assertive = false) {
  const el = assertive ? $("#alert") : $("#live");
  el.textContent = ""; setTimeout(() => { el.textContent = msg; }, 50);
}
function toast(msg, bad = false) {
  announce(msg, bad);
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : ""); t.innerHTML = icon(bad ? "alert" : "check") + `<span>${esc(msg)}</span>`;
  $("#toasts").appendChild(t); setTimeout(() => t.remove(), bad ? 7000 : 4000);
}

/* ----------------------------------------------- accessible confirm dialog */
function confirmDialog(title, body, action = "Confirm") {
  return new Promise(resolve => {
    const d = $("#dlg"), opener = document.activeElement;
    $("#dlg-title").textContent = title; $("#dlg-body").textContent = body; $("#dlg-yes").textContent = action;
    $("#dlg-yes").className = /delete|remove/i.test(action) ? "danger" : "primary";
    const done = v => { d.close(); resolve(v); if (opener && opener.focus) opener.focus(); };
    $("#dlg-yes").onclick = () => done(true); $("#dlg-no").onclick = () => done(false);
    d.oncancel = e => { e.preventDefault(); done(false); };
    d.showModal(); $("#dlg-no").focus();
  });
}

/* --------------------------------------------------------------- api */
let ME = null;
async function api(path, opts = {}) {
  const r = await fetch("/vault/console/api/" + path, { credentials: "same-origin", ...opts });
  if (r.status === 401 && path !== "login") { ME = null; route(); throw new Error("Your session ended. Please sign in again."); }
  const ct = r.headers.get("content-type") || "";
  const data = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(data.message || data.error || ("Request failed (HTTP " + r.status + ")"));
  return data;
}

/* ------------------------------------------------------------ routing */
const VIEWS = [
  { id: "buckets", label: "Buckets", icon: "bucket", group: "Storage", fn: vBuckets },
  { id: "browser", label: "Object browser", icon: "files", group: "Storage", fn: vBrowser },
  { id: "overview", label: "Architecture", icon: "arch", group: "Operations", admin: true, fn: vOverview, live: true },
  { id: "cluster", label: "Cluster and drives", icon: "server", group: "Operations", admin: true, fn: vCluster, live: true },
  { id: "healing", label: "Healing", icon: "heal", group: "Operations", admin: true, fn: vHealing, live: true },
  { id: "replication", label: "Replication", icon: "repl", group: "Operations", admin: true, fn: vReplication, live: true },
  { id: "services", label: "Services and usage", icon: "plug", group: "Operations", admin: true, fn: vServices },
  { id: "users", label: "Users", icon: "users", group: "Administration", admin: true, fn: vUsers },
  { id: "settings", label: "Display settings", icon: "gear", group: "Administration", fn: vSettings },
];
let STATE = { bucket: "", prefix: "" }, TIMER = null, CURRENT = null;

function route() {
  clearInterval(TIMER);
  if (!ME) return renderLogin();
  const id = (location.hash.match(/^#\/([\w-]+)/) || [])[1] || "buckets";
  let view = VIEWS.find(v => v.id === id && (!v.admin || ME.admin)) || VIEWS[0];

  const first = CURRENT !== view.id; CURRENT = view.id;
  document.title = view.label + " · Vault Console";

  if (view.live) TIMER = setInterval(() => { const m = $("#main"), a = document.activeElement;
    if (PREFS.live && m && (!m.contains(a) || a === m)) show(view, false, true); }, 5000);
}

async function show(view, focusHeading, quiet = false) {
  const main = $("#main");

  catch (e) { main.innerHTML = `<h1 id="page-title">${esc(view.label)}</h1><div class="card" role="alert">${icon("alert")} ${esc(e.message)}</div>`; }
  finally { main.removeAttribute("aria-busy"); }
  if (focusHeading) { const h = $("#page-title"); if (h) { h.setAttribute("tabindex", "-1"); h.focus(); } announce(view.label + " page loaded"); }
}

function uploadOne(file, li) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest(), bar = li.querySelector("[role=progressbar]"), fill = bar.firstElementChild;
    x.open("PUT", "/vault/console/api/objects?" + q({ bucket: STATE.bucket, key: STATE.prefix + file.name }));
    x.setRequestHeader("x-content-type", file.type || "application/octet-stream");
    x.setRequestHeader("x-encrypt", $("#enc").checked ? "1" : "0");
    x.upload.onprogress = e => { if (e.lengthComputable) { const v = Math.round(e.loaded / e.total * 100);
      bar.setAttribute("aria-valuenow", v); bar.setAttribute("aria-valuetext", v + "%"); fill.style.width = v + "%"; } };
    x.onload = () => x.status < 300 ? resolve() : reject(new Error((() => { try { return JSON.parse(x.responseText).message; } catch (e) { return "HTTP " + x.status; } })()));
    x.onerror = () => reject(new Error("Network error"));
    x.send(file);
  });
}
async function uploadAll(files, main) {
  if (!files.length) return;
  const list = $("#uploads");
  announce(`Uploading ${files.length} file${files.length > 1 ? "s" : ""}`);
  let ok = 0;
  for (const f of files) {
    const li = document.createElement("li");
    li.innerHTML = `<span class="mono">${esc(f.name)} <span class="hint">(${fmtB(f.size)})</span></span>${meter(0, "Upload progress for " + f.name)}<span class="st">${chip("Uploading", "info")}</span>`;
    list.appendChild(li);
    try { await uploadOne(f, li); ok++; li.querySelector(".st").innerHTML = chip("Done", "ok"); }
    catch (err) { li.querySelector(".st").innerHTML = chip("Failed", "bad"); toast(`${f.name}: ${err.message}`, true); }
  }
  toast(`${ok} of ${files.length} file${files.length > 1 ? "s" : ""} uploaded`);
  const keep = list.innerHTML; await vBrowser(main); $("#uploads").innerHTML = keep; $("#pick").focus();
}

      <button class="primary" type="submit" ${bs.length ? "" : "disabled"}>Start heal</button><p id="hres" class="hint" role="status" style="align-self:center"></p></form></section>
    <section class="card" aria-labelledby="dh-h"><h2 id="dh-h">Drive heals</h2>${drives.length ? `<ul class="uploads">${drives.map(([ep, s]) =>
      `<li><span class="mono">${esc(ep)}</span>${meter((s.progress || 0) * 100, "Heal progress for " + ep)}<span>${chip(s.state, s.state === "done" ? "ok" : s.state === "failed" ? "bad" : "warn")} ${s.objects ?? ""} / ${s.total ?? ""}</span></li>`).join("")}</ul>`
      : '<p class="empty">No drive heals on this node.</p>'}</section>
    <section class="card" aria-labelledby="rh-h"><h2 id="rh-h">Recent object heals</h2>${(h.recent || []).length ? `<div class="tbl" role="group" aria-labelledby="rh-h" tabindex="0"><table>
      <caption class="sr-only">Objects repaired recently</caption><thead><tr><th scope="col">Object</th><th scope="col">Result</th><th scope="col">Time</th></tr></thead>
      <tbody>${h.recent.slice().reverse().map(r => `<tr><th scope="row" class="mono">${esc(r.bucket)}/${esc(r.key)}</th>
        <td>${r.healed.length} drive${r.healed.length === 1 ? "" : "s"} repaired${r.dangling_removed.length ? ", stale copies removed" : ""}</td><td><time datetime="${isoT(r.time)}">${fmtT(r.time)}</time></td></tr>`).join("")}</tbody></table></div>`
      : '<p class="empty">Nothing needed healing recently.</p>'}</section>`;
  $("#hf").onsubmit = async e => { e.preventDefault(); const b = $("#hb").value; $("#hres").textContent = "Healing " + b + "…";
    try { const r = await api("heal?" + q({ bucket: b }), { method: "POST" }); $("#hres").textContent = `Done: scanned ${r.scanned} objects, repaired ${r.healed}.`; }
    catch (err) { $("#hres").textContent = err.message; } };
}

/* -------------------------------------------------------- replication */
async function vReplication(main) {
  const r = await api("replication"), t = r.total;
  main.innerHTML = `<div class="page-head"><div class="grow"><h1 id="page-title">Replication</h1>
      <p class="sub">Copies of objects sent to Remote S3, aggregated from every node.</p></div>
      ${t.queued_count ? chip(`${t.queued_count} waiting`, "warn", true) : chip("Backlog clear", "ok", true)}</div>
    <div class="grid">${[["Waiting", t.queued_count], ["Waiting size", fmtB(t.queued_bytes)], ["In flight", t.in_flight], ["Completed", t.completed],
      ["Failed", t.failed], ["Lag", t.lag_seconds.toFixed(1) + " s"], ["Latency p99", t.latency_p99.toFixed(2) + " s"]]
      .map(([k, v]) => `<div class="card stat"><p class="k">${k}</p><p class="v">${v}</p></div>`).join("")}</div>
    <section class="card" aria-labelledby="rn-h"><h2 id="rn-h">Per node</h2><div class="tbl" role="group" aria-labelledby="rn-h" tabindex="0"><table>
      <caption class="sr-only">Replication statistics per node</caption>
      <thead><tr><th scope="col">Node</th><th scope="col" class="num">Waiting</th><th scope="col" class="num">Completed</th><th scope="col" class="num">Failed</th><th scope="col" class="num">Lag</th></tr></thead>
      <tbody>${r.nodes.map(n => `<tr><th scope="row">${esc(n.node)}</th><td class="num">${n.queued_count}</td><td class="num">${n.completed}</td><td class="num">${n.failed}</td><td class="num">${(n.lag_seconds || 0).toFixed(1)} s</td></tr>`).join("")}</tbody></table></div></section>`;
}

/* ----------------------------------------------------------- services */
async function vServices(main) {
  const [s, u] = await Promise.all([api("services"), api("usage")]);
  const rows = [["KMS Provider", status(s.kms.online), `${s.kms.provider} ${s.kms.addr || ""}`], ["Keystone", status(s.keystone.configured ? s.keystone.online : null), ""]]
    .concat(s.targets.events.map(t => ["Event target", status(t.online), `${t.arn} · ${t.queued} queued`]))
    .concat(s.targets.audit.map(t => ["Audit target", status(t.online), `${t.id} · ${t.queued} queued`]))
    .concat([["Remote S3 tiers", status(s.tiers.length ? true : null), s.tiers.join(", ") || "none configured"]]);
  const ub = Object.entries(u.buckets);
  main.innerHTML = `<div class="page-head"><div class="grow"><h1 id="page-title">Services and usage</h1>
      <p class="sub">External services from the design, plus per-bucket usage measured by the scanner.</p></div></div>
    <section class="card" aria-labelledby="sv-h"><h2 id="sv-h">External services</h2><div class="tbl" role="group" aria-labelledby="sv-h" tabindex="0"><table>
      <caption class="sr-only">External services and their status</caption>
      <thead><tr><th scope="col">Service</th><th scope="col">Status</th><th scope="col">Detail</th></tr></thead>
      <tbody>${rows.map(([a, b, c]) => `<tr><th scope="row">${esc(a)}</th><td>${b}</td><td class="mono">${esc(c)}</td></tr>`).join("")}</tbody></table></div></section>
    <section class="card" aria-labelledby="us-h"><h2 id="us-h">Usage by bucket</h2>${ub.length ? `<div class="tbl" role="group" aria-labelledby="us-h" tabindex="0"><table>
      <caption class="sr-only">Objects, versions and bytes per bucket</caption>
      <thead><tr><th scope="col">Bucket</th><th scope="col" class="num">Objects</th><th scope="col" class="num">Versions</th><th scope="col" class="num">Size</th><th scope="col" class="num">Replication pending</th></tr></thead>
      <tbody>${ub.map(([b, x]) => `<tr><th scope="row">${esc(b)}</th><td class="num">${x.objects}</td><td class="num">${x.versions}</td><td class="num">${fmtB(x.bytes)}</td><td class="num">${x.replication_pending}</td></tr>`).join("")}</tbody></table></div>`
      : '<p class="empty">No scanner data yet. Usage appears after the first scanner cycle.</p>'}</section>`;
}

/* -------------------------------------------------------------- users */
async function vUsers(main) {
  const d = await api("users");
  main.innerHTML = `<div class="page-head"><div class="grow"><h1 id="page-title">Users</h1>
      <p class="sub">Local IAM users. Keystone and OIDC users are managed in their own systems.</p></div></div>
    <section class="card" aria-labelledby="nu-h"><h2 id="nu-h">Add a user</h2>
      <form class="row" id="nu" novalidate>
        <div class="field grow"><label for="uak">Access key</label><input id="uak" required autocomplete="off" spellcheck="false" aria-describedby="uak-err"><span class="err" id="uak-err"></span></div>
        <div class="field grow"><label for="usk">Secret key</label><input id="usk" type="password" required minlength="8" autocomplete="new-password" aria-describedby="usk-hint usk-err">
          <span class="hint" id="usk-hint">At least 8 characters.</span><span class="err" id="usk-err"></span></div>
        <div class="field"><label for="upol">Policy</label><select id="upol">${d.policies.map(p => `<option>${esc(p)}</option>`).join("")}</select><span class="err"></span></div>
        <button class="primary" type="submit">Add user</button></form></section>
    <section class="card" aria-labelledby="ul-h"><h2 id="ul-h">Users <span class="chip">${d.users.length}</span></h2>${d.users.length ? `<div class="tbl" role="group" aria-labelledby="ul-h" tabindex="0"><table>
      <caption class="sr-only">Users, status and attached policies</caption>
      <thead><tr><th scope="col">Access key</th><th scope="col">Status</th><th scope="col">Policies</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead>
      <tbody>${d.users.map(u => `<tr><th scope="row" class="mono">${esc(u.access_key)}</th><td>${chip(u.status === "enabled" ? "Enabled" : "Disabled", u.status === "enabled" ? "ok" : "bad")}</td>
        <td>${u.policies.map(p => chip(p)).join("")}</td><td class="actions"><button type="button" class="danger" data-u="${esc(u.access_key)}" aria-label="Remove user ${esc(u.access_key)}">Remove</button></td></tr>`).join("")}</tbody></table></div>`
      : '<p class="empty">No users yet. The root user always exists.</p>'}</section>`;
  $("#nu").onsubmit = async e => {
    e.preventDefault(); let ok = true;
    for (const [id, test, msg] of [["uak", v => v.length >= 3, "Access key needs at least 3 characters."], ["usk", v => v.length >= 8, "Secret key needs at least 8 characters."]]) {
      const el = $("#" + id), bad = !test(el.value); el.setAttribute("aria-invalid", bad); $("#" + id + "-err").textContent = bad ? msg : ""; if (bad && ok) { el.focus(); ok = false; }
    }
    if (!ok) return;
    try { await api("users", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ access_key: $("#uak").value, secret_key: $("#usk").value, policies: [$("#upol").value] }) });
      toast("User " + $("#uak").value + " added"); await vUsers(main); $("#page-title").focus(); }
    catch (err) { $("#uak-err").textContent = err.message; announce(err.message, true); }
  };
  $$("[data-u]", main).forEach(b => b.onclick = async () => {
    if (!await confirmDialog("Remove user?", `Remove the user "${b.dataset.u}"? Their keys stop working immediately.`, "Remove user")) return;
    try { await api("users?" + q({ access_key: b.dataset.u }), { method: "DELETE" }); toast("User removed"); await vUsers(main); $("#page-title").focus(); }
    catch (err) { toast(err.message, true); }
  });
}

/* ----------------------------------------------------------- settings */
async function vSettings(main) {
  const opt = (name, value, label) => `<label style="display:flex;gap:.6rem;align-items:center;min-height:44px;font-weight:400"><input type="radio" name="${name}" value="${value}" ${String(PREFS[name]) === String(value) ? "checked" : ""} style="min-height:auto;width:1.2rem;height:1.2rem">${label}</label>`;
  main.innerHTML = `<div class="page-head"><div class="grow"><h1 id="page-title">Display settings</h1>
      <p class="sub">Saved in this browser. These add to your operating system's own accessibility settings.</p></div></div>
    <form class="settings" id="sf">
      <fieldset class="card"><legend><h2 style="margin:0">Theme</h2></legend>
        ${opt("theme", "system", "Match my system")}${opt("theme", "light", "Light")}${opt("theme", "dark", "Dark")}${opt("theme", "contrast", "High contrast (black and yellow)")}</fieldset>
      <fieldset class="card"><legend><h2 style="margin:0">Text size</h2></legend>
        ${opt("scale", 1, "Default (100%)")}${opt("scale", 1.125, "Large (112%)")}${opt("scale", 1.25, "Larger (125%)")}${opt("scale", 1.5, "Largest (150%)")}</fieldset>
      <fieldset class="card"><legend><h2 style="margin:0">Motion</h2></legend>
        ${opt("motion", "system", "Match my system")}${opt("motion", "reduce", "Reduce motion")}</fieldset>
      <fieldset class="card"><legend><h2 style="margin:0">Live updates</h2></legend>
        <p class="hint">Status pages refresh every 5 seconds. Refreshing pauses while focus is inside the page, so it never moves your place.</p>
        ${opt("live", true, "On")}${opt("live", false, "Paused")}</fieldset>
    </form>`;
  $("#sf").onchange = e => {
    const { name, value } = e.target;
    PREFS[name] = name === "scale" ? Number(value) : name === "live" ? value === "true" : value;
    applyPrefs(); const lt = $("#live-toggle"); if (lt) lt.setAttribute("aria-pressed", PREFS.live);
    announce("Setting saved: " + e.target.closest("label").textContent.trim());
  };
}

/* --------------------------------------------------------------- boot */
window.addEventListener("hashchange", route);
api("me").then(m => { ME = m; route(); }).catch(() => route());
</script>
</body>
</html>
