<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Vault web console: manage buckets and objects, and monitor the storage cluster, healing, replication and services.">
<title>Vault Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Vault design system: soft canvas, rounded cards, pill navigation, orange brand accent.
   Every text pair meets WCAG AA (>= 4.5:1); control borders and chart marks >= 3:1. */
:root{
  --canvas:#e8e8e8;--bg:#f5f5f4;--panel:#ffffff;--panel-2:#f5f5f4;--hover:#efefee;--ink:#111111;--muted:#57575c;--line:#e7e7e5;--ctl:#8a8a8f;
  --accent:#111111;--accent-ink:#ffffff;--accent-soft:#f1f1f0;--accent-text:#111111;--focus:#1d4ed8;
  --brand:#e8590c;--brand-deep:#c2410c;--brand-soft:#fff1e8;--brand-text:#9a3412;--bar-data:#1c1c1e;
  --ok:#067647;--ok-bg:#ecfdf3;--bad:#b42318;--bad-bg:#fef3f2;--warn:#93370d;--warn-bg:#fffaeb;--info:#1849a9;--info-bg:#eff4ff;
  --chip:#f1f1f0;--chip-ink:#3a3a3e;--shadow:0 1px 2px rgba(17,17,17,.04);--overlay:rgba(17,17,17,.55);
  --radius:20px;--radius-sm:12px;--sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Fira Code",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--scale:1;--ease:cubic-bezier(.2,.8,.2,1);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme]){
  --canvas:#050506;--bg:#0d0d0f;--panel:#17171a;--panel-2:#1f1f23;--hover:#26262b;--ink:#f4f4f5;--muted:#a1a1aa;--line:#2a2a2f;--ctl:#76767f;
  --accent:#f4f4f5;--accent-ink:#111111;--accent-soft:#26262b;--accent-text:#f4f4f5;--focus:#fbbf24;
  --brand:#fb7a3c;--brand-deep:#c2410c;--brand-soft:#3a1a0b;--brand-text:#fdba74;--bar-data:#e4e4e7;
  --ok:#4ade80;--ok-bg:#0f2a1a;--bad:#fca5a5;--bad-bg:#3b1219;--warn:#fcd34d;--warn-bg:#33270a;--info:#93c5fd;--info-bg:#172554;
  --chip:#26262b;--chip-ink:#d4d4d8;--shadow:none;--overlay:rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#050506;--bg:#0d0d0f;--panel:#17171a;--panel-2:#1f1f23;--hover:#26262b;--ink:#f4f4f5;--muted:#a1a1aa;--line:#2a2a2f;--ctl:#76767f;
  --accent:#f4f4f5;--accent-ink:#111111;--accent-soft:#26262b;--accent-text:#f4f4f5;--focus:#fbbf24;
  --brand:#fb7a3c;--brand-deep:#c2410c;--brand-soft:#3a1a0b;--brand-text:#fdba74;--bar-data:#e4e4e7;
  --ok:#4ade80;--ok-bg:#0f2a1a;--bad:#fca5a5;--bad-bg:#3b1219;--warn:#fcd34d;--warn-bg:#33270a;--info:#93c5fd;--info-bg:#172554;
  --chip:#26262b;--chip-ink:#d4d4d8;--shadow:none;--overlay:rgba(0,0,0,.7);color-scheme:dark}
:root[data-theme="contrast"]{
  --canvas:#000;--bg:#000;--panel:#000;--panel-2:#000;--hover:#1a1a1a;--ink:#fff;--muted:#fff;--line:#fff;--ctl:#fff;
  --accent:#ffff00;--accent-ink:#000;--accent-soft:#000;--accent-text:#ffff00;--focus:#00ffff;
  --brand:#ffff00;--brand-deep:#000;--brand-soft:#000;--brand-text:#ffff00;--bar-data:#fff;
  --ok:#00ff7f;--ok-bg:#000;--bad:#ff6b6b;--bad-bg:#000;--warn:#ffd700;--warn-bg:#000;--info:#9fd3ff;--info-bg:#000;
  --chip:#000;--chip-ink:#fff;--shadow:none;--overlay:rgba(0,0,0,.85);color-scheme:dark}
:root[data-theme="contrast"] .chip,:root[data-theme="contrast"] .card{border:1px solid #fff}
:root[data-theme="contrast"] .hero{border:2px solid #ffff00}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{font-size:calc(16px * var(--scale));-webkit-text-size-adjust:100%}
body{margin:0;font:400 1rem/1.6 var(--sans);background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased}
.sr-only{position:absolute!important;width:1px!important;min-width:0!important;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:999px;font-weight:600;text-decoration:none}
.skip:focus{top:12px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
/* headings receive focus programmatically on navigation (for screen readers); they are not controls, so no ring */
h1[tabindex="-1"]:focus{outline:none}
a{color:var(--ink);text-underline-offset:3px}
h1{font-size:2.25rem;line-height:1.15;margin:0;font-weight:600;letter-spacing:-.025em;text-wrap:balance}
h2{font-size:1.125rem;line-height:1.35;margin:0 0 1rem;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:.5rem}
h3{font-size:.95rem;margin:0 0 .5rem;font-weight:600}
p{margin:.25rem 0}
button,.btn{font:inherit;font-weight:500;font-size:.9375rem;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:.5rem 1.125rem;border-radius:999px;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  text-decoration:none;transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease),transform .1s var(--ease);touch-action:manipulation}
button:hover,.btn:hover{background:var(--hover)}
button:active,.btn:active{transform:scale(.98)}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.primary:hover,.btn.primary:hover{background:var(--accent);opacity:.9}
button.soft,.btn.soft{background:var(--panel-2);border-color:transparent}
button.danger{color:var(--bad);background:transparent}
button.danger:hover{background:var(--bad-bg);border-color:var(--bad)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--hover)}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{font:inherit;font-size:.9375rem;padding:.5rem .875rem;min-height:44px;border:1px solid var(--ctl);border-radius:var(--radius-sm);background:var(--panel);color:var(--ink);min-width:0}
input:hover,select:hover{border-color:var(--ink)}
input[aria-invalid="true"]{border-color:var(--bad);border-width:2px}
input[type=checkbox],input[type=radio]{accent-color:var(--brand-deep);cursor:pointer}
label{font-weight:500;font-size:.9375rem}
.field{display:flex;flex-direction:column;gap:.375rem;min-width:0}
.hint{color:var(--muted);font-size:.875rem;font-weight:400}
.err{color:var(--bad);font-size:.875rem;font-weight:500}
.err:empty{display:none}
svg.i{width:1.2rem;height:1.2rem;flex:none}

/* ---------- frame: canvas > rounded app surface ---------- */
.app{display:grid;grid-template-columns:76px 1fr;grid-template-rows:auto 1fr;gap:0 1.25rem;max-width:1480px;margin:1.25rem auto;padding:1.25rem 1.5rem 2rem;
  background:var(--bg);border-radius:32px;min-height:calc(100vh - 2.5rem)}
.app>*{min-width:0} /* let wide tables scroll inside their box instead of widening the page (WCAG 1.4.10) */
.top{grid-column:1 / -1;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:0 0 1.25rem}
.brand{display:inline-flex;align-items:center;gap:.625rem;font-weight:700;font-size:1.125rem;letter-spacing:-.01em;background:var(--panel);border-radius:999px;padding:.375rem 1.125rem .375rem .375rem;min-height:52px;box-shadow:var(--shadow)}
.logo{width:40px;height:40px;border-radius:50%;background:var(--brand-deep);display:grid;place-items:center;color:#fff}
.pillnav{flex:1;display:flex;justify-content:center;min-width:0}
.pillnav ul{list-style:none;margin:0;padding:.375rem;display:flex;gap:.25rem;background:var(--panel);border-radius:999px;overflow-x:auto;max-width:100%;box-shadow:var(--shadow);scrollbar-width:none}
.pillnav a{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1.25rem;border-radius:999px;color:var(--muted);text-decoration:none;min-height:44px;font-weight:500;white-space:nowrap;
  transition:background-color .15s var(--ease),color .15s var(--ease)}
.pillnav a:hover{color:var(--ink);background:var(--hover)}
.pillnav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.actions-top{display:flex;align-items:center;gap:.5rem}
.iconbtn{width:48px;height:48px;padding:0;border-radius:50%;border-color:transparent;background:var(--panel);box-shadow:var(--shadow)}
.iconbtn[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-text)}
.userpill{display:flex;align-items:center;gap:.625rem;background:var(--panel);border-radius:999px;padding:.375rem 1rem .375rem .375rem;min-height:52px;box-shadow:var(--shadow)}
.userpill strong{display:block;font-weight:600;font-size:.9375rem;line-height:1.2}
.userpill .hint{font-size:.8125rem;line-height:1.2}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;font-weight:700;font-size:.8125rem;flex:none}
.side{display:flex;flex-direction:column;gap:1rem;align-items:center;position:sticky;top:1.25rem;align-self:start}
.rail{list-style:none;margin:0;padding:.375rem;display:flex;flex-direction:column;gap:.375rem;background:var(--panel);border-radius:999px;box-shadow:var(--shadow)}
.rail a,.rail button{width:48px;height:48px;padding:0;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--muted);text-decoration:none;min-height:44px}
.rail a:hover,.rail button:hover{background:var(--hover);color:var(--ink)}
.rail a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
main{min-width:0;outline:none}
.page-head{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin:.25rem 0 1.5rem}.page-head .grow{flex:1;min-width:240px}
.sub{color:var(--muted);margin-top:.5rem;max-width:70ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.25rem 1.5rem;margin-bottom:1.25rem;box-shadow:var(--shadow)}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));margin-bottom:1.25rem}
.stat{padding:1.25rem 1.375rem}
.stat .k{color:var(--muted);font-size:.9375rem;font-weight:500;margin:0}
.stat .v{overflow-wrap:anywhere;font-size:2rem;font-weight:600;letter-spacing:-.03em;margin:.5rem 0 .25rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .note{font-size:.8125rem;color:var(--muted);margin:0}
.row{display:flex;gap:.75rem;align-items:flex-end;flex-wrap:wrap}.row.center{align-items:center}.grow{flex:1}

/* ---------- overview dashboard ---------- */
.dash{display:grid;gap:1.25rem;grid-template-columns:repeat(12,minmax(0,1fr))}
.dash>.card{margin:0}
.dash>.card.span-4{display:flex;flex-direction:column}
.span-4{grid-column:span 4}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
.dash-col{grid-column:span 4;display:grid;gap:1.25rem;align-content:start}.dash-col>.card{margin:0}
.big{font-size:2.5rem;font-weight:600;letter-spacing:-.035em;line-height:1.1;margin:.5rem 0 .5rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.delta{display:inline-flex;align-items:center;gap:.25rem;border-radius:999px;padding:.0625rem .5rem;font-size:.8125rem;font-weight:600;background:var(--ok-bg);color:var(--ok);margin-right:.375rem}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.kpi{background:var(--panel-2);border-radius:18px;padding:1rem 1.125rem;display:flex;flex-direction:column;gap:.125rem;min-width:0}
.kpi .top-line{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-weight:500;font-size:.875rem;line-height:1.3}
.kpi .badge{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--panel);color:var(--ink);flex:none}
.kpi .v{font-size:1.875rem;font-weight:600;letter-spacing:-.03em;margin:.75rem 0 .5rem;font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere}
.kpi.hero{background:#ad3a0d;color:#fff}
.kpi.hero .badge{background:rgba(255,255,255,.18);color:#fff}
.kpi.hero .delta{background:#fff;color:#9a3412}
.kpi.hero .note{color:#fff}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(104px,100%),1fr));gap:.5rem;background:var(--panel-2);border-radius:16px;padding:.75rem;margin-top:1rem}
.mini{background:var(--panel);border-radius:12px;padding:.625rem .75rem;min-width:0}
.mini .chip{font-size:.75rem;padding:0 .5rem;margin:.25rem 0 0}
.mini strong{display:block;font-weight:600;overflow-wrap:anywhere}
.mini .size{font-size:1rem;font-weight:600;margin:.25rem 0 0;font-variant-numeric:tabular-nums}
.mini .hint{font-size:.75rem}
.hatch{height:.75rem;border-radius:999px;overflow:hidden;display:flex;background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 10px);border:1px solid var(--line)}
.hatch>span{display:block;height:100%;background:var(--brand-deep);border-radius:999px}
.setcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
.setcard{border-radius:16px;padding:1rem;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:#1c1c1e}
.setcard.alt{background:#ad3a0d}
.setcard .label{font-size:.75rem;opacity:1}
.setcard .val{font-weight:600;font-size:1.125rem;font-variant-numeric:tabular-nums}
.setcard .pill{align-self:flex-start;background:#fff;color:#111;border-radius:999px;padding:.0625rem .625rem;font-size:.75rem;font-weight:600}
.setcard .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
:root[data-theme="contrast"] .setcard{background:#000;border:2px solid #fff}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:500 11px var(--sans)}
.chart .val{fill:var(--ink);font-weight:600}
.chart .grid-line{stroke:var(--line);stroke-dasharray:3 4}
.chart .data{fill:var(--bar-data)}
.chart .parity{fill:url(#hatch)}
.legend{display:flex;gap:1rem;list-style:none;margin:0;padding:0;font-size:.8125rem;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:.375rem}
.sw{width:.75rem;height:.75rem;border-radius:3px;display:inline-block}
.sw.data{background:var(--bar-data)}.sw.parity{background:var(--brand)}
.chartbox{position:relative;background:var(--panel-2);border-radius:16px;padding:.75rem .75rem .25rem;flex:1;display:flex;flex-direction:column;justify-content:flex-end}
.status{display:inline-flex;align-items:center;gap:.4rem;font-weight:500}
.status::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:currentColor}
.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.status.info{color:var(--info)}.status.muted{color:var(--muted)}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:.875rem;color:var(--muted);pointer-events:none}
.search{flex:1 1 180px;min-width:0}
.search input{padding-left:2.5rem;border-radius:999px;width:100%;min-width:0;border-color:var(--ctl)}

/* ---------- tables ---------- */
.tbl{overflow-x:auto;border-radius:10px;position:relative} /* contains .sr-only descendants so they cannot widen the page */
.card>.tbl{margin:0 -1.5rem -1.25rem;border-radius:0 0 var(--radius) var(--radius)}
table{width:100%;border-collapse:collapse;min-width:520px;font-size:.9375rem}
caption{text-align:left;font-weight:600;padding:0 0 .6rem}
th,td{text-align:left;padding:.875rem 1.5rem;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child>*{border-bottom:0}
thead th{color:var(--muted);font-size:.875rem;font-weight:500;background:var(--panel-2);padding-top:.75rem;padding-bottom:.75rem;border-bottom:0}
tbody th{font-weight:500}
tbody tr{transition:background-color .15s var(--ease)}
tbody tr:hover{background:var(--panel-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}
td.actions{text-align:right;white-space:nowrap}td.actions>*{margin-left:.375rem}
td.actions .btn,td.actions button{min-height:36px;padding:.375rem .875rem;font-size:.875rem}

/* ---------- chips, meters, lists ---------- */
.chip{display:inline-flex;align-items:center;gap:.375rem;padding:.125rem .625rem;border-radius:999px;background:var(--chip);color:var(--chip-ink);font-size:.8125rem;font-weight:500;line-height:1.5;margin:.125rem .25rem .125rem 0;overflow-wrap:break-word;max-width:100%}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.info{background:var(--info-bg);color:var(--info)}
.chip .dot{width:.5rem;height:.5rem;border-radius:50%;background:currentColor}
.mono{font-family:var(--mono);font-size:.8125rem;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.meter{height:.5rem;background:var(--chip);border-radius:99px;overflow:hidden;min-width:80px}
.meter>span{display:block;height:100%;background:var(--brand-deep);border-radius:99px}
:root[data-theme="contrast"] .meter{border:1px solid #fff}
.drives{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr));gap:.625rem;list-style:none;margin:1rem 0 0;padding:0}
.drive{border:1px solid var(--line);border-top:3px solid var(--ok);border-radius:var(--radius-sm);padding:.75rem;background:var(--panel-2);display:grid;gap:.375rem}
.drive.bad{border-top-color:var(--bad)}.drive strong{display:block;font-weight:600}
.crumbs ol{list-style:none;display:flex;flex-wrap:wrap;gap:.25rem;margin:0;padding:0;align-items:center}
.crumbs li+li::before{content:"/";color:var(--muted);margin-right:.25rem}
.crumbs button{min-height:36px;padding:.25rem .5rem;border:0;background:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.crumbs [aria-current]{font-weight:600;color:var(--ink);text-decoration:none}
.drop{border:1.5px dashed var(--ctl);border-radius:var(--radius);padding:1.75rem 1.5rem;text-align:center;color:var(--muted);background:var(--panel-2);transition:border-color .15s var(--ease),background-color .15s var(--ease)}
.drop.over{border-color:var(--brand-deep);color:var(--brand-text);background:var(--brand-soft)}
.uploads{list-style:none;margin:1rem 0 0;padding:0;display:grid;gap:.625rem}
.uploads li{display:grid;grid-template-columns:1fr 160px auto;gap:.75rem;align-items:center}
.arch{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:1rem}
.arch .card{margin:0}
.arch ul{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.arch li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem;padding:.625rem .875rem;border-radius:var(--radius-sm);background:var(--panel-2);font-size:.9375rem}
.empty{padding:2rem 1rem;text-align:center;color:var(--muted)}
.pill-toggle[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-text)}

/* ---------- sign-in ---------- */
.login-wrap{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:1.5rem;background:var(--canvas)}
.login{width:100%;max-width:440px;padding:0}
.login .card{padding:2.25rem;margin:0;border-radius:28px}
.login form{display:grid;gap:1rem;margin-top:1.5rem}
.login h1{font-size:1.75rem}
.pw{display:flex;gap:.5rem}.pw input{flex:1;min-width:8rem}

/* ---------- overlays ---------- */
dialog{border:1px solid var(--line);border-radius:24px;background:var(--panel);color:var(--ink);padding:1.75rem;max-width:min(92vw,440px);box-shadow:0 24px 60px rgba(17,17,17,.25)}
dialog::backdrop{background:var(--overlay)}
dialog h2{margin-bottom:.5rem}
dialog .row{justify-content:flex-end;margin-top:1.5rem}
.demo-note{margin:0;padding:.75rem 1.125rem;border-radius:16px;background:var(--warn-bg);color:var(--warn);border:1px solid currentColor;font-size:.875rem;line-height:1.5}
.toasts{position:fixed;right:1rem;bottom:1rem;display:grid;gap:.5rem;z-index:50;max-width:min(92vw,380px)}
.toast{padding:.75rem 1.125rem;border-radius:16px;background:var(--ink);color:var(--bg);box-shadow:0 10px 30px rgba(17,17,17,.25);font-weight:500;font-size:.9375rem;display:flex;gap:.625rem;align-items:flex-start}
.toast.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.settings{display:grid;gap:1rem}
fieldset.card{margin:0}legend{padding:0 .25rem}

/* ---------- motion & system modes ---------- */
@media (prefers-reduced-motion:no-preference){:root:not([data-motion="reduce"]) .toast{animation:pop .2s var(--ease)}
  :root:not([data-motion="reduce"]) .meter>span,:root:not([data-motion="reduce"]) .hatch>span{transition:width .5s var(--ease)}
  :root:not([data-motion="reduce"]) main[data-enter]>*{animation:rise .28s var(--ease) both}
  :root:not([data-motion="reduce"]) main[data-enter] .dash>*{animation:rise .32s var(--ease) both}
  :root:not([data-motion="reduce"]) main[data-enter] .dash>*:nth-child(2){animation-delay:.04s}
  :root:not([data-motion="reduce"]) main[data-enter] .dash>*:nth-child(3){animation-delay:.08s}
  :root:not([data-motion="reduce"]) main[data-enter] .dash>*:nth-child(n+4){animation-delay:.12s}}

const icon = n => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${ICON[n]||""}</svg>`;

/* --------------------------------------------------- preferences (a11y) */

/* ------------------------------------------------ announcements & toasts */
function announce(msg, assertive = false) {
  const el = assertive ? $("#alert") : $("#live");
  el.textContent = ""; setTimeout(() => { el.textContent = msg; }, 50);
}
function toast(msg, bad = false) {
  announce(msg, bad);
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : ""); t.innerHTML = icon(bad ? "alert" : "check") + `<span>${esc(msg)}</span>`;
  $("#toasts").appendChild(t); setTimeout(() => t.remove(), bad ? 7000 : 4000);
}

/* ----------------------------------------------- accessible confirm dialog */
function confirmDialog(title, body, action = "Confirm") {
  return new Promise(resolve => {
    const d = $("#dlg"), opener = document.activeElement;
    $("#dlg-title").textContent = title; $("#dlg-body").textContent = body; $("#dlg-yes").textContent = action;
    $("#dlg-yes").className = /delete|remove/i.test(action) ? "danger" : "primary";
    const done = v => { d.close(); resolve(v); if (opener && opener.focus) opener.focus(); };
    $("#dlg-yes").onclick = () => done(true); $("#dlg-no").onclick = () => done(false);
    d.oncancel = e => { e.preventDefault(); done(false); };
    d.showModal(); $("#dlg-no").focus();
  });
}

/* --------------------------------------------------------------- api */
let ME = null;
let DEMO = false;  // true when the page is hosted without a Vault backend (e.g. a static Vercel deploy)
async function api(path, opts = {}) {
  if (DEMO) return demoApi(path, opts);
  let r;
  try { r = await fetch("/vault/console/api/" + path, { credentials: "same-origin", ...opts }); }
  catch (e) { if (path === "me") return enterDemo(); throw new Error("Can't reach the Vault server."); }
  const isJson = (r.headers.get("content-type") || "").includes("json");
  if (path === "me" && (r.status === 404 || r.status === 405 || (!isJson && r.status !== 401))) return enterDemo();
  if (r.status === 401 && path !== "login") { ME = null; route(); throw new Error("Your session ended. Please sign in again."); }
  if (r.status === 401 && path !== "login") { ME = null; route(); throw new Error("Your session ended. Please sign in again."); }
  const ct = r.headers.get("content-type") || "";
  const data = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(data.message || data.error || ("Request failed (HTTP " + r.status + ")"));
  return data;
}

/* ---------------------------------------------------------- demo mode
   Static hosting (no Vault backend) runs the console on sample data held in this
   browser tab, clearly labelled. Nothing is stored anywhere. */
const DEMO_USER = { access_key: "vaultadmin", secret_key: "vaultadmin-secret" };
let DB = null;
function enterDemo() {
  DEMO = true;
  document.documentElement.setAttribute("data-demo", "");
  throw new Error("demo");  // boot treats this as "not signed in"
}
function demoSeed() {
  const now = Date.now() / 1000, day = 86400;
  const obj = (key, size, ageDays, extra = {}) => ({ key, size, modified: now - ageDays * day, etag: Math.random().toString(16).slice(2, 18),
    version: "null", encrypted: false, storage_class: "STANDARD", replication: "", body: null, ...extra });
  DB = {
    session: false,
    buckets: [
      { name: "photos", created: now - 40 * day, versioning: "Enabled", encrypted: true, replication: true, lifecycle: true, events: true, public: false },
      { name: "backups", created: now - 12 * day, versioning: "Unversioned", encrypted: true, replication: false, lifecycle: true, events: false, public: false },
      { name: "public-assets", created: now - 3 * day, versioning: "Unversioned", encrypted: false, replication: false, lifecycle: false, events: false, public: true },
    ],
    objects: {
      photos: [obj("2026/cat.jpg", 204800, 1, { encrypted: true, replication: "COMPLETED" }), obj("2026/dog.png", 1843200, 2, { encrypted: true, replication: "COMPLETED" }),
               obj("2025/beach.jpg", 3145728, 90, { encrypted: true, storage_class: "COLD", replication: "COMPLETED" }), obj("readme.txt", 512, 5, { encrypted: true, replication: "PENDING" })],
      backups: [obj("db/2026-09-25.sql.gz", 52428800, 1, { encrypted: true }), obj("db/2026-09-24.sql.gz", 51380224, 2, { encrypted: true }),
                obj("db/2026-06-01.sql.gz", 48234496, 117, { encrypted: true, storage_class: "COLD" })],
      "public-assets": [obj("logo.svg", 4096, 3), obj("css/site.css", 18432, 3)],
    },
    users: [{ access_key: "alice", status: "enabled", policies: ["readonly"] }, { access_key: "ci-uploader", status: "enabled", policies: ["writeonly"] }],
    policies: ["consoleAdmin", "readonly", "readwrite", "writeonly"],
    replicated: 1284, recent: [{ bucket: "photos", key: "2026/dog.png", healed: ["node3:/data/disk2"], dangling_removed: [], time: now - 3600 }],
    started: now - 3 * 3600,
  };
}
function demoCluster() {
  const nodes = ["node1", "node2", "node3", "node4"], up = Math.floor(Date.now() / 1000 - DB.started);
  const used = DB.buckets.reduce((a, b) => a + (DB.objects[b.name] || []).reduce((s, o) => s + o.size, 0), 0);
  const drive = (n, d) => ({ endpoint: `${n}:/data/disk${d}`, state: "ok", total: 20 * 2 ** 30, used: Math.round(2 ** 30 * (1.5 + d * .4) + used * 1.6 / 16), healing: false });
  const sets = [0, 1].map(s => ({ pool: 0, set: s, online: 8, n: 8, parity: 3, read_quorum: 5, write_quorum: 5,
    drives: nodes.flatMap(n => [drive(n, s * 2 + 1), drive(n, s * 2 + 2)]) }));
  return { nodes: nodes.map((n, i) => ({ node: n, state: "online", uptime: up - i * 7, native: true, version: "0.1.0",
    drives: [1, 2, 3, 4].map(d => ({ online: true })), scanner: { cycle: 40 + Math.floor(up / 30) } })), storage: { sets } };
}
function demoUsage() {
  const buckets = {};

    buckets[b.name] = { objects: os.length, versions: os.length, delete_markers: 0, bytes: os.reduce((s, o) => s + o.size, 0),
      replication_pending: os.filter(o => o.replication === "PENDING").length, replication_failed: 0 }; }

}
async function demoApi(path, opts = {}) {
  if (!DB) demoSeed();
  await new Promise(r => setTimeout(r, 120));  // feel like a network call
  const [rt, qs] = path.split("?"), p = Object.fromEntries(new URLSearchParams(qs || "")), m = (opts.method || "GET").toUpperCase();
  const body = () => { try { return JSON.parse(opts.body || "{}"); } catch (e) { return {}; } };
  const fail = msg => { throw new Error(msg); };
  if (rt === "login") { const d = body();
    if (d.access_key !== DEMO_USER.access_key || d.secret_key !== DEMO_USER.secret_key) fail("Invalid access key or secret. In demo mode use vaultadmin / vaultadmin-secret.");
    DB.session = true; return { user: "vaultadmin", admin: true }; }

      DB.objects[d.name] = []; return { ok: true }; }
    case "buckets DELETE": { bucket(p.name); if ((DB.objects[p.name] || []).length) fail("The bucket you tried to delete is not empty.");
      DB.buckets = DB.buckets.filter(b => b.name !== p.name); delete DB.objects[p.name]; return { ok: true }; }
    case "objects GET": { bucket(p.bucket); const pre = p.prefix || "", prefixes = new Set(), objects = [];
      for (const o of (DB.objects[p.bucket] || []).slice().sort((a, b) => a.key.localeCompare(b.key))) {

      const o = { key: p.key, size: opts.body?.size ?? 0, modified: Date.now() / 1000, etag: Math.random().toString(16).slice(2, 18), version: "null",
        encrypted: opts.encrypt || bucket(p.bucket).encrypted, storage_class: "STANDARD", replication: bucket(p.bucket).replication ? "COMPLETED" : "", body: opts.body || null };
      DB.objects[p.bucket] = list.filter(x => x.key !== p.key).concat(o); if (o.replication) DB.replicated++; return { etag: o.etag }; }
    case "objects DELETE": bucket(p.bucket); DB.objects[p.bucket] = DB.objects[p.bucket].filter(o => o.key !== p.key); return { ok: true };
    case "overview GET": {
      const buckets = DB.buckets.map(b => { const os = DB.objects[b.name] || []; return { name: b.name, objects: os.length, bytes: os.reduce((t, o) => t + o.size, 0), truncated: false }; });
      const recent = DB.buckets.flatMap(b => (DB.objects[b.name] || []).map(o => ({ bucket: b.name, key: o.key, size: o.size, modified: o.modified,
        encrypted: o.encrypted, replication: o.replication, storage_class: o.storage_class }))).sort((a, b) => b.modified - a.modified).slice(0, 12);
      return { buckets, recent }; }
    case "cluster GET": return demoCluster();
    case "healing GET": return { queue: 0, mrf: 0, drives: {}, recent: DB.recent };
    case "heal POST": { const n = (DB.objects[bucket(p.bucket).name] || []).length; return { bucket: p.bucket, prefix: "", scanned: n, healed: 0 }; }
    case "replication GET": { const pend = Object.values(DB.objects).flat().filter(o => o.replication === "PENDING").length;
      const node = i => ({ node: "node" + (i + 1), queued_count: i === 0 ? pend : 0, completed: Math.round(DB.replicated / 4), failed: 0, lag_seconds: i === 0 && pend ? 1.2 : 0 });
      return { total: { queued_count: pend, queued_bytes: pend * 512, in_flight: 0, completed: DB.replicated, completed_bytes: DB.replicated * 900000, failed: 0,
        lag_seconds: pend ? 1.2 : 0, latency_p99: 0.84 }, nodes: [0, 1, 2, 3].map(node) }; }
    case "usage GET": return demoUsage();
    case "services GET": return { kms: { provider: "hashicorp-vault-transit", online: true, addr: "http://kms:8200 (demo)" }, keystone: { configured: true, online: true },
      targets: { events: [{ arn: "arn:vault:sqs::events:webhook", id: "webhook:events", online: true, queued: 0 }, { arn: "arn:vault:sqs::events:kafka", id: "kafka:events", online: true, queued: 0 }],
                 audit: [{ id: "webhook:audit", online: true, queued: 0 }, { id: "kafka:audit", online: true, queued: 0 }, { id: "file:audit", online: true, queued: 0 }] }, tiers: ["COLD"] };
    case "users GET": return { users: DB.users.map(u => ({ ...u })), policies: DB.policies };
    case "users POST": { const d = body(); if (DB.users.some(u => u.access_key === d.access_key)) fail("That user already exists.");
      DB.users.push({ access_key: d.access_key, status: "enabled", policies: d.policies || [] }); return { ok: true }; }
    case "users DELETE": DB.users = DB.users.filter(u => u.access_key !== p.access_key); return { ok: true };
  }
  fail("Not available in demo mode.");
}
function demoDownload(key) {
  const o = (DB.objects[STATE.bucket] || []).find(x => x.key === key); if (!o) return;
  const blob = o.body instanceof Blob ? o.body : new Blob([`Demo file "${key}" (${fmtB(o.size)}).\nThis deployment has no storage backend, so sample objects have no real content.\n`], { type: "text/plain" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = key.split("/").pop() + (o.body ? "" : ".txt");
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  announce("Download started");
}
const demoNote = () => DEMO ? `<p class="demo-note" role="note"><strong>Demo mode.</strong> This deployment has no storage backend, so you're seeing sample data. Changes stay in this browser tab only. Run the real cluster with Docker (see the README) to store data.</p>` : "";

/* ------------------------------------------------------------ routing */
const VIEWS = [
  { id: "home", label: "Overview", icon: "home", place: "nav", fn: vHome, live: true },
  { id: "buckets", label: "Buckets", icon: "bucket", place: "nav", fn: vBuckets },
  { id: "browser", label: "Objects", icon: "files", place: "nav", fn: vBrowser },
  { id: "overview", label: "Architecture", icon: "arch", place: "rail", admin: true, fn: vOverview, live: true },
  { id: "cluster", label: "Cluster", icon: "server", place: "nav", admin: true, fn: vCluster, live: true },
  { id: "healing", label: "Healing", icon: "heal", place: "nav", admin: true, fn: vHealing, live: true },
  { id: "replication", label: "Replication", icon: "repl", place: "nav", admin: true, fn: vReplication, live: true },
  { id: "services", label: "Services and usage", icon: "plug", place: "rail", admin: true, fn: vServices },
  { id: "users", label: "Users", icon: "users", place: "rail", admin: true, fn: vUsers },
  { id: "settings", label: "Display settings", icon: "gear", place: "rail", fn: vSettings },
];
let STATE = { bucket: "", prefix: "" }, TIMER = null, CURRENT = null;

function route() {
  clearInterval(TIMER);
  if (!ME) return renderLogin();
  const id = (location.hash.match(/^#\/([\w-]+)/) || [])[1] || "home";
  let view = VIEWS.find(v => v.id === id && (!v.admin || ME.admin)) || VIEWS[0];

  if (view.live) TIMER = setInterval(() => { const m = $("#main"), a = document.activeElement;

async function show(view, focusHeading, quiet = false) {
  const main = $("#main");
  main.setAttribute("aria-busy", "true");
  try { await view.fn(main); }
  catch (e) { main.innerHTML = `<h1 id="page-title">${esc(view.label)}</h1><div class="card" role="alert">${icon("alert")} ${esc(e.message)}</div>`; }
  finally { main.removeAttribute("aria-busy"); }
  if (focusHeading) { main.setAttribute("data-enter", ""); setTimeout(() => main.removeAttribute("data-enter"), 600); }
  if (focusHeading) { const h = $("#page-title"); if (h) { h.setAttribute("tabindex", "-1"); h.focus(); } announce(view.label + " page loaded"); }
}

/* ------------------------------------------------------------ overview */
function parityChart(buckets) {
  const rows = buckets.filter(b => b.bytes > 0).slice(0, 6);
  if (!rows.length) return `<p class="empty">No data stored yet. Upload an object to see how erasure coding spreads it.</p>`;
  const W = 340, H = 250, L = 8, R = 8, T = 22, B = 26, ph = H - T - B;
  const parity = b => Math.round(b.bytes * 3 / 5);  // EC 5+3: 3 parity pieces per 5 data pieces
  const max = Math.max(...rows.map(b => b.bytes + parity(b)));
  // linear scale, but every bucket stays visible (min 10px) so small buckets don't vanish
  const hgt = v => Math.max(10, (v / max) * (ph - 8));
  const slot = (W - L - R) / rows.length, bw = Math.min(40, slot * .56);
  const trunc = s => s.length > 10 ? s.slice(0, 9) + "…" : s;
  const bars = rows.map((b, i) => { const x = L + slot * i + (slot - bw) / 2, total = hgt(b.bytes + parity(b)), hd = total * 5 / 8, hp = total - hd;
    const yb = T + ph, yd = yb - hd, yp = yd - hp;
    return `<rect class="data" x="${x}" y="${yd}" width="${bw}" height="${hd}" rx="7"/>
      <rect class="parity" x="${x}" y="${yp}" width="${bw}" height="${Math.max(0, hp - 3)}" rx="7"/>
      <text class="val" x="${x + bw / 2}" y="${yp - 7}" text-anchor="middle">${fmtB(b.bytes + parity(b))}</text>
      <text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(trunc(b.name))}</text>`; }).join("");
  const grid = [0, .25, .5, .75, 1].map(f => `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${T + ph - f * (ph - 8)}" y2="${T + ph - f * (ph - 8)}"/>`).join("");
  const summary = rows.map(b => `${b.name}: ${fmtB(b.bytes)} data plus ${fmtB(parity(b))} parity`).join("; ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="ch-t ch-d">
      <title id="ch-t">Data and parity bytes per bucket</title><desc id="ch-d">${esc(summary)}. Bar heights have a minimum so small buckets stay visible.</desc>
      <defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
        <rect width="7" height="7" style="fill:var(--brand)"/><rect width="2.5" height="7" style="fill:var(--panel-2)" opacity=".45"/></pattern></defs>
      ${grid}${bars}</svg>
    <div class="sr-only"><table><caption>Data and parity per bucket</caption><thead><tr><th scope="col">Bucket</th><th scope="col">Data</th><th scope="col">Parity</th></tr></thead>
      <tbody>${rows.map(b => `<tr><th scope="row">${esc(b.name)}</th><td>${fmtB(b.bytes)}</td><td>${fmtB(parity(b))}</td></tr>`).join("")}</tbody></table></div>
    <p class="hint" style="margin:.25rem .25rem 0;font-size:.75rem">Labels show total on disk. Parity is ${"3/5"} of the data size.</p>`;
}

function objStatus(o) {
  if (o.replication === "COMPLETED") return `<span class="status ok">Replicated</span>`;
  if (o.replication === "PENDING") return `<span class="status warn">Replicating</span>`;
  if (o.replication === "FAILED") return `<span class="status bad" style="color:var(--bad)">Replication failed</span>`;
  if (o.storage_class && o.storage_class !== "STANDARD") return `<span class="status info">Tiered: ${esc(o.storage_class)}</span>`;
  if (o.encrypted) return `<span class="status info">Encrypted</span>`;
  return `<span class="status muted">Stored</span>`;
}

function uploadOne(file, li) {
  if (DEMO) return demoUpload(file, li);
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest(), bar = li.querySelector("[role=progressbar]"), fill = bar.firstElementChild;
    x.open("PUT", "/vault/console/api/objects?" + q({ bucket: STATE.bucket, key: STATE.prefix + file.name }));
    x.setRequestHeader("x-content-type", file.type || "application/octet-stream");
    x.setRequestHeader("x-encrypt", $("#enc").checked ? "1" : "0");
    x.upload.onprogress = e => { if (e.lengthComputable) { const v = Math.round(e.loaded / e.total * 100);
      bar.setAttribute("aria-valuenow", v); bar.setAttribute("aria-valuetext", v + "%"); fill.style.width = v + "%"; } };
    x.onload = () => x.status < 300 ? resolve() : reject(new Error((() => { try { return JSON.parse(x.responseText).message; } catch (e) { return "HTTP " + x.status; } })()));
    x.onerror = () => reject(new Error("Network error"));
    x.send(file);
  });
}
async function demoUpload(file, li) {
  const bar = li.querySelector("[role=progressbar]"), fill = bar.firstElementChild;
  for (const v of [15, 40, 70, 100]) { await new Promise(r => setTimeout(r, 120));
    bar.setAttribute("aria-valuenow", v); bar.setAttribute("aria-valuetext", v + "%"); fill.style.width = v + "%"; }
  await demoApi("objects?" + q({ bucket: STATE.bucket, key: STATE.prefix + file.name }), { method: "PUT", body: file, encrypt: $("#enc").checked });
}
async function uploadAll(files, main) {
  if (!files.length) return;
  const list = $("#uploads");
  announce(`Uploading ${files.length} file${files.length > 1 ? "s" : ""}`);
  let ok = 0;
  for (const f of files) {
    const li = document.createElement("li");
    li.innerHTML = `<span class="mono">${esc(f.name)} <span class="hint">(${fmtB(f.size)})</span></span>${meter(0, "Upload progress for " + f.name)}<span class="st">${chip("Uploading", "info")}</span>`;
    list.appendChild(li);
    try { await uploadOne(f, li); ok++; li.querySelector(".st").innerHTML = chip("Done", "ok"); }
    catch (err) { li.querySelector(".st").innerHTML = chip("Failed", "bad"); toast(`${f.name}: ${err.message}`, true); }
  }
  toast(`${ok} of ${files.length} file${files.length > 1 ? "s" : ""} uploaded`);
  const keep = list.innerHTML; await vBrowser(main); $("#uploads").innerHTML = keep; $("#pick").focus();
}

    <form class="settings" id="sf">
      <fieldset class="card"><legend><h2 style="margin:0">Theme</h2></legend>
        ${opt("theme", "system", "Match my system")}${opt("theme", "light", "Light")}${opt("theme", "dark", "Dark")}${opt("theme", "contrast", "High contrast (black and yellow)")}</fieldset>
      <fieldset class="card"><legend><h2 style="margin:0">Text size</h2></legend>
        ${opt("scale", 1, "Default (100%)")}${opt("scale", 1.125, "Large (112%)")}${opt("scale", 1.25, "Larger (125%)")}${opt("scale", 1.5, "Largest (150%)")}</fieldset>
      <fieldset class="card"><legend><h2 style="margin:0">Motion</h2></legend>
        ${opt("motion", "system", "Match my system")}${opt("motion", "reduce", "Reduce motion")}</fieldset>
      <fieldset class="card"><legend><h2 style="margin:0">Live updates</h2></legend>
        <p class="hint">Status pages refresh every 5 seconds. Refreshing pauses while focus is inside the page, so it never moves your place.</p>
        ${opt("live", true, "On")}${opt("live", false, "Paused")}</fieldset>
    </form>`;
  $("#sf").onchange = e => {
    const { name, value } = e.target;
    PREFS[name] = name === "scale" ? Number(value) : name === "live" ? value === "true" : value;
    applyPrefs(); syncThemeButton(); const lt = $("#live-toggle"); if (lt) lt.setAttribute("aria-pressed", PREFS.live);
    announce("Setting saved: " + e.target.closest("label").textContent.trim());
  };
}

/* --------------------------------------------------------------- boot */
window.addEventListener("hashchange", route);
api("me").then(m => { ME = m; route(); }).catch(() => route());
</script>
</body>
</html>
