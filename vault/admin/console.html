<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Vault web console: manage buckets and objects, and monitor the storage cluster, healing, replication and services.">
<title>Vault Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700&display=swap">
<style>
/* Vault design system: flat, slate + blue, Fira Sans / Fira Code.
   Every text pair meets WCAG AA (>= 4.5:1); control borders >= 3:1. */
:root{
  --bg:#f8fafc;--panel:#ffffff;--panel-2:#f8fafc;--hover:#f1f5f9;--ink:#0f172a;--muted:#475569;--line:#e2e8f0;--ctl:#64748b;
  --accent:#2563eb;--accent-ink:#ffffff;--accent-soft:#eff6ff;--accent-text:#1d4ed8;--focus:#2563eb;
  --ok:#047857;--ok-bg:#ecfdf5;--bad:#b91c1c;--bad-bg:#fef2f2;--warn:#92400e;--warn-bg:#fffbeb;--info:#1d4ed8;--info-bg:#eff6ff;
  --chip:#f1f5f9;--chip-ink:#334155;--shadow:0 1px 2px rgba(15,23,42,.04);--overlay:rgba(15,23,42,.55);
  --radius:12px;--radius-sm:8px;--sans:"Fira Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Fira Code",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--scale:1;--ease:cubic-bezier(.2,.8,.2,1);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme]){
  --bg:#0b1120;--panel:#111827;--panel-2:#0f172a;--hover:#1e293b;--ink:#e2e8f0;--muted:#94a3b8;--line:#1f2a3c;--ctl:#64748b;
  --accent:#60a5fa;--accent-ink:#0b1120;--accent-soft:#172554;--accent-text:#93c5fd;--focus:#fbbf24;
  --ok:#34d399;--ok-bg:#062e23;--bad:#fca5a5;--bad-bg:#3b1219;--warn:#fbbf24;--warn-bg:#342507;--info:#93c5fd;--info-bg:#172554;
  --chip:#1e293b;--chip-ink:#cbd5e1;--shadow:none;--overlay:rgba(2,6,23,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1120;--panel:#111827;--panel-2:#0f172a;--hover:#1e293b;--ink:#e2e8f0;--muted:#94a3b8;--line:#1f2a3c;--ctl:#64748b;
  --accent:#60a5fa;--accent-ink:#0b1120;--accent-soft:#172554;--accent-text:#93c5fd;--focus:#fbbf24;
  --ok:#34d399;--ok-bg:#062e23;--bad:#fca5a5;--bad-bg:#3b1219;--warn:#fbbf24;--warn-bg:#342507;--info:#93c5fd;--info-bg:#172554;
  --chip:#1e293b;--chip-ink:#cbd5e1;--shadow:none;--overlay:rgba(2,6,23,.7);color-scheme:dark}
:root[data-theme="contrast"]{
  --bg:#000;--panel:#000;--panel-2:#000;--hover:#1a1a1a;--ink:#fff;--muted:#fff;--line:#fff;--ctl:#fff;
  --accent:#ffff00;--accent-ink:#000;--accent-soft:#000;--accent-text:#ffff00;--focus:#00ffff;
  --ok:#00ff7f;--ok-bg:#000;--bad:#ff6b6b;--bad-bg:#000;--warn:#ffd700;--warn-bg:#000;--info:#9fd3ff;--info-bg:#000;
  --chip:#000;--chip-ink:#fff;--shadow:none;--overlay:rgba(0,0,0,.85);color-scheme:dark}
:root[data-theme="contrast"] .chip,:root[data-theme="contrast"] .card{border:1px solid #fff}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{font-size:calc(16px * var(--scale));-webkit-text-size-adjust:100%}
body{margin:0;font:400 1rem/1.6 var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:var(--radius-sm);font-weight:600;text-decoration:none}
.skip:focus{top:12px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
/* headings receive focus programmatically on navigation (for screen readers); they are not controls, so no ring */
h1[tabindex="-1"]:focus{outline:none}
a{color:var(--accent-text);text-underline-offset:3px}
h1{font-size:1.625rem;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:1.0625rem;line-height:1.35;margin:0 0 1rem;font-weight:600;letter-spacing:-.005em;display:flex;align-items:center;gap:.5rem}
h3{font-size:.95rem;margin:0 0 .5rem;font-weight:600}
p{margin:.25rem 0}
button,.btn{font:inherit;font-weight:500;font-size:.9375rem;cursor:pointer;border:1px solid var(--ctl);background:var(--panel);color:var(--ink);
  padding:.5rem 1rem;border-radius:var(--radius-sm);min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  text-decoration:none;transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease);touch-action:manipulation}
button:hover,.btn:hover{background:var(--hover)}
button:active,.btn:active{background:var(--line)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.primary:hover{background:var(--accent);filter:brightness(1.08)}
button.danger{color:var(--bad);border-color:var(--line);background:transparent}
button.danger:hover{background:var(--bad-bg);border-color:var(--bad)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--hover)}
button:disabled{opacity:.5;cursor:not-allowed;filter:none}
input,select{font:inherit;font-size:.9375rem;padding:.5rem .75rem;min-height:44px;border:1px solid var(--ctl);border-radius:var(--radius-sm);background:var(--panel);color:var(--ink);min-width:0;
  transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
input:hover,select:hover{border-color:var(--ink)}
input[aria-invalid="true"]{border-color:var(--bad);border-width:2px}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);cursor:pointer}
label{font-weight:500;font-size:.9375rem}
.field{display:flex;flex-direction:column;gap:.375rem;min-width:0}
.hint{color:var(--muted);font-size:.875rem;font-weight:400}
.err{color:var(--bad);font-size:.875rem;font-weight:500}
.err:empty{display:none}
svg.i{width:1.125rem;height:1.125rem;flex:none}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;min-height:100dvh}
.app>*{min-width:0} /* let wide tables scroll inside their box instead of widening the page (WCAG 1.4.10) */
.side{background:var(--panel);border-right:1px solid var(--line);padding:1.25rem .875rem;display:flex;flex-direction:column;gap:.5rem;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:.625rem;font-weight:700;font-size:1.125rem;letter-spacing:-.01em;padding:0 .5rem .75rem}
.logo{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.side nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.side nav a{display:flex;align-items:center;gap:.75rem;padding:.5rem .75rem;border-radius:var(--radius-sm);color:var(--muted);text-decoration:none;min-height:44px;font-weight:500;font-size:.9375rem;
  transition:background-color .15s var(--ease),color .15s var(--ease)}
.side nav a:hover{background:var(--hover);color:var(--ink)}
.side nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.navgroup{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:1rem .75rem .375rem}
.me{margin-top:auto;border-top:1px solid var(--line);padding:1rem .25rem 0;display:flex;flex-direction:column;gap:.75rem}
.me .who{display:flex;align-items:center;gap:.75rem;min-width:0}.me .who strong{font-weight:600}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:700;font-size:.8125rem;flex:none}
.top{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;padding:.75rem 2rem;border-bottom:1px solid var(--line);background:var(--panel);min-height:60px}
.top .grow{flex:1}
main{padding:2rem 2rem 4rem;min-width:0;outline:none;max-width:1280px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}.page-head .grow{flex:1;min-width:240px}
.sub{color:var(--muted);margin-top:.375rem;max-width:70ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.25rem 1.5rem;margin-bottom:1.25rem;box-shadow:var(--shadow)}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));margin-bottom:1.25rem}
.stat{padding:1.125rem 1.25rem}
.stat .k{color:var(--muted);font-size:.8125rem;font-weight:500;margin:0}
.stat .v{overflow-wrap:anywhere;font-family:var(--mono);font-size:1.75rem;font-weight:600;letter-spacing:-.02em;margin:.375rem 0 .125rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .note{font-size:.8125rem;color:var(--muted);margin:0}
.row{display:flex;gap:.75rem;align-items:flex-end;flex-wrap:wrap}.row.center{align-items:center}.grow{flex:1}

/* ---------- tables ---------- */
.tbl{overflow-x:auto;border-radius:10px;position:relative} /* contains .sr-only descendants so they cannot widen the page */
.card>.tbl{margin:0 -1.5rem -1.25rem;border-radius:0 0 var(--radius) var(--radius);border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;min-width:520px;font-size:.9375rem}
caption{text-align:left;font-weight:600;padding:0 0 .6rem}
th,td{text-align:left;padding:.75rem 1.5rem;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child>*{border-bottom:0}
thead th{color:var(--muted);font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:var(--panel-2);padding-top:.625rem;padding-bottom:.625rem}
tbody th{font-weight:500}
tbody tr{transition:background-color .15s var(--ease)}
tbody tr:hover{background:var(--hover)}
td.num,th.num{text-align:right;font-family:var(--mono);font-size:.875rem;font-variant-numeric:tabular-nums}
thead th.num{font-family:var(--sans);font-size:.75rem}
td.actions{text-align:right;white-space:nowrap}td.actions>*{margin-left:.375rem}
td.actions .btn,td.actions button{min-height:36px;padding:.375rem .75rem;font-size:.875rem}

/* ---------- chips, meters, lists ---------- */
.chip{display:inline-flex;align-items:center;gap:.375rem;padding:.125rem .625rem;border-radius:99px;background:var(--chip);color:var(--chip-ink);font-size:.8125rem;font-weight:500;line-height:1.5;margin:.125rem .25rem .125rem 0;overflow-wrap:anywhere}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.info{background:var(--info-bg);color:var(--info)}
.chip .dot{width:.5rem;height:.5rem;border-radius:50%;background:currentColor}
.mono{font-family:var(--mono);font-size:.8125rem;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.meter{height:.5rem;background:var(--chip);border-radius:99px;overflow:hidden;min-width:80px}
.meter>span{display:block;height:100%;background:var(--accent);border-radius:99px}
:root[data-theme="contrast"] .meter{border:1px solid #fff}
.drives{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr));gap:.625rem;list-style:none;margin:1rem 0 0;padding:0}
.drive{border:1px solid var(--line);border-top:3px solid var(--ok);border-radius:var(--radius-sm);padding:.75rem;background:var(--panel-2);display:grid;gap:.375rem}
.drive.bad{border-top-color:var(--bad)}.drive strong{display:block;font-weight:600}
.crumbs ol{list-style:none;display:flex;flex-wrap:wrap;gap:.25rem;margin:0;padding:0;align-items:center}
.crumbs li+li::before{content:"/";color:var(--muted);margin-right:.25rem}
.crumbs button{min-height:36px;padding:.25rem .5rem;border:0;background:none;color:var(--accent-text);text-decoration:underline;text-underline-offset:3px}
.crumbs [aria-current]{font-weight:600;color:var(--ink);text-decoration:none}
.drop{border:1.5px dashed var(--ctl);border-radius:var(--radius);padding:1.75rem 1.5rem;text-align:center;color:var(--muted);background:var(--panel-2);transition:border-color .15s var(--ease),background-color .15s var(--ease)}
.drop.over{border-color:var(--accent);color:var(--accent-text);background:var(--accent-soft)}
.uploads{list-style:none;margin:1rem 0 0;padding:0;display:grid;gap:.625rem}
.uploads li{display:grid;grid-template-columns:1fr 160px auto;gap:.75rem;align-items:center}
.arch{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:1rem}
.arch .card{margin:0}
.arch ul{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.arch li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem;padding:.625rem .875rem;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel-2);font-size:.9375rem}
.empty{padding:2rem 1rem;text-align:center;color:var(--muted)}
.pill-toggle{min-height:36px;padding:.375rem .875rem;font-size:.875rem;border-color:var(--line)}
.pill-toggle[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent)}

/* ---------- sign-in ---------- */
.login-wrap{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:1.5rem;background:var(--bg)}
.login{width:100%;max-width:420px;padding:0}
.login .card{padding:2rem;margin:0}
.login form{display:grid;gap:1rem;margin-top:1.5rem}
.pw{display:flex;gap:.5rem}.pw input{flex:1;min-width:8rem}

/* ---------- overlays ---------- */
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--ink);padding:1.5rem;max-width:min(92vw,440px);box-shadow:0 20px 50px rgba(15,23,42,.25)}
dialog::backdrop{background:var(--overlay)}
dialog h2{margin-bottom:.5rem}
dialog .row{justify-content:flex-end;margin-top:1.5rem}
.demo-note{margin:0;padding:.75rem 1rem;border-radius:var(--radius-sm);background:var(--warn-bg);color:var(--warn);border:1px solid currentColor;font-size:.875rem;line-height:1.5}
.toasts{position:fixed;right:1rem;bottom:1rem;display:grid;gap:.5rem;z-index:50;max-width:min(92vw,380px)}
.toast{padding:.75rem 1rem;border-radius:var(--radius-sm);background:var(--ink);color:var(--bg);box-shadow:0 8px 24px rgba(15,23,42,.2);font-weight:500;font-size:.9375rem;display:flex;gap:.625rem;align-items:flex-start}
.toast.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.settings{display:grid;gap:1rem}
fieldset.card{margin:0}legend{padding:0 .25rem}

/* ---------- motion & system modes ---------- */
@media (prefers-reduced-motion:no-preference){:root:not([data-motion="reduce"]) .toast{animation:pop .2s var(--ease)}
  :root:not([data-motion="reduce"]) .meter>span{transition:width .4s var(--ease)}
  :root:not([data-motion="reduce"]) main[data-enter]>*{animation:rise .24s var(--ease) both}}
:root[data-motion="reduce"] *,:root[data-motion="reduce"] *::before{transition:none!important;animation:none!important}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
@media (forced-colors:active){.chip,.card,.drive,button{border:1px solid CanvasText}.meter>span{background:Highlight}}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .side nav ul{flex-direction:row;flex-wrap:wrap}.navgroup{width:100%;margin-top:.5rem}.me{margin-top:0}main,.top{padding:1rem}
  .card{padding:1rem 1.125rem}.card>.tbl{margin:0 -1.125rem -1rem}th,td{padding:.625rem 1rem}.uploads li{grid-template-columns:1fr}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<div id="root"></div>
<!-- screen reader announcements: polite for status, assertive for errors -->
<div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="alert" class="sr-only" role="alert" aria-atomic="true"></div>
<div class="toasts" aria-hidden="true" id="toasts"></div>
<dialog id="dlg" aria-labelledby="dlg-title" aria-describedby="dlg-body">
  <h2 id="dlg-title">Confirm</h2><p id="dlg-body"></p>
  <div class="row"><button type="button" id="dlg-no">Cancel</button><button type="button" class="primary" id="dlg-yes">Confirm</button></div>
</dialog>
<script>
"use strict";
/* ---------------------------------------------------------------- helpers */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtB = n => { if (n == null) return "–"; const u = ["B","KiB","MiB","GiB","TiB"]; let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; } return (i ? n.toFixed(1) : n) + " " + u[i]; };
const fmtT = t => t ? new Date(t * 1000).toLocaleString() : "–";
const isoT = t => t ? new Date(t * 1000).toISOString() : "";
const q = o => new URLSearchParams(o).toString();
const ICON = {
  bucket:'<path d="M4 7h16l-1.5 12a2 2 0 0 1-2 1.8h-9a2 2 0 0 1-2-1.8L4 7z"/><path d="M3 7c0-1.7 4-3 9-3s9 1.3 9 3"/>',
  files:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  arch:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  server:'<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  heal:'<path d="M12 21s-7-4.4-9.3-9A5 5 0 0 1 12 6a5 5 0 0 1 9.3 6c-2.3 4.6-9.3 9-9.3 9z"/><path d="M12 10v5M9.5 12.5h5"/>',
  repl:'<path d="M4 7h11l-3-3M20 17H9l3 3"/>',
  plug:'<path d="M9 7V3M15 7V3M6 7h12v4a6 6 0 0 1-12 0zM12 17v4"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6 6 0 0 0-4-5.6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  upload:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>', check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
  alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
};
const icon = n => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${ICON[n]||""}</svg>`;
const chip = (text, kind = "", dot = false) => `<span class="chip ${kind}">${dot ? '<span class="dot" aria-hidden="true"></span>' : ""}${esc(text)}</span>`;
const status = ok => ok == null ? chip("Not configured") : ok ? chip("Up", "ok", true) : chip("Down", "bad", true);

/* ------------------------------------------------ announcements & toasts */
function announce(msg, assertive = false) {
  const el = assertive ? $("#alert") : $("#live");
  el.textContent = ""; setTimeout(() => { el.textContent = msg; }, 50);
}
function toast(msg, bad = false) {
  announce(msg, bad);
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : ""); t.innerHTML = icon(bad ? "alert" : "check") + `<span>${esc(msg)}</span>`;
  $("#toasts").appendChild(t); setTimeout(() => t.remove(), bad ? 7000 : 4000);
}

/* ----------------------------------------------- accessible confirm dialog */
function confirmDialog(title, body, action = "Confirm") {
  return new Promise(resolve => {
    const d = $("#dlg"), opener = document.activeElement;
    $("#dlg-title").textContent = title; $("#dlg-body").textContent = body; $("#dlg-yes").textContent = action;
    $("#dlg-yes").className = /delete|remove/i.test(action) ? "danger" : "primary";
    const done = v => { d.close(); resolve(v); if (opener && opener.focus) opener.focus(); };
    $("#dlg-yes").onclick = () => done(true); $("#dlg-no").onclick = () => done(false);
    d.oncancel = e => { e.preventDefault(); done(false); };
    d.showModal(); $("#dlg-no").focus();
  });
}

/* --------------------------------------------------------------- api */
let ME = null;
let DEMO = false;  // true when the page is hosted without a Vault backend (e.g. a static Vercel deploy)
async function api(path, opts = {}) {
  if (DEMO) return demoApi(path, opts);
  let r;
  try { r = await fetch("/vault/console/api/" + path, { credentials: "same-origin", ...opts }); }
  catch (e) { if (path === "me") return enterDemo(); throw new Error("Can't reach the Vault server."); }
  const isJson = (r.headers.get("content-type") || "").includes("json");
  if (path === "me" && (r.status === 404 || r.status === 405 || (!isJson && r.status !== 401))) return enterDemo();
  if (r.status === 401 && path !== "login") { ME = null; route(); throw new Error("Your session ended. Please sign in again."); }
  if (r.status === 401 && path !== "login") { ME = null; route(); throw new Error("Your session ended. Please sign in again."); }
  const ct = r.headers.get("content-type") || "";
  const data = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(data.message || data.error || ("Request failed (HTTP " + r.status + ")"));
  return data;
}

async function demoApi(path, opts = {}) {
  if (!DB) demoSeed();
  await new Promise(r => setTimeout(r, 120));  // feel like a network call
  const [rt, qs] = path.split("?"), p = Object.fromEntries(new URLSearchParams(qs || "")), m = (opts.method || "GET").toUpperCase();
  const body = () => { try { return JSON.parse(opts.body || "{}"); } catch (e) { return {}; } };
  const fail = msg => { throw new Error(msg); };
  if (rt === "login") { const d = body();
    if (d.access_key !== DEMO_USER.access_key || d.secret_key !== DEMO_USER.secret_key) fail("Invalid access key or secret. In demo mode use vaultadmin / vaultadmin-secret.");
    DB.session = true; return { user: "vaultadmin", admin: true }; }
  if (rt === "logout") { DB.session = false; return { ok: true }; }
  if (!DB.session) { ME = null; setTimeout(() => route(), 0); fail("Please sign in."); }
  const bucket = n => DB.buckets.find(b => b.name === n) || fail(`The bucket "${n}" does not exist.`);
  switch (rt + " " + m) {
    case "me GET": return { user: "vaultadmin", source: "demo", admin: true, policies: ["consoleAdmin"] };
    case "buckets GET": return DB.buckets.map(b => ({ ...b }));
    case "buckets POST": { const d = body(); if (DB.buckets.some(b => b.name === d.name)) fail("You already own a bucket with that name.");
      DB.buckets.push({ name: d.name, created: Date.now() / 1000, versioning: d.versioning ? "Enabled" : "Unversioned", encrypted: false, replication: false, lifecycle: false, events: false, public: false });
      DB.objects[d.name] = []; return { ok: true }; }
    case "buckets DELETE": { bucket(p.name); if ((DB.objects[p.name] || []).length) fail("The bucket you tried to delete is not empty.");
      DB.buckets = DB.buckets.filter(b => b.name !== p.name); delete DB.objects[p.name]; return { ok: true }; }
    case "objects GET": { bucket(p.bucket); const pre = p.prefix || "", prefixes = new Set(), objects = [];
      for (const o of (DB.objects[p.bucket] || []).slice().sort((a, b) => a.key.localeCompare(b.key))) {
        if (!o.key.startsWith(pre)) continue; const rest = o.key.slice(pre.length), i = rest.indexOf("/");
        if (i >= 0) prefixes.add(pre + rest.slice(0, i + 1)); else objects.push({ ...o, body: undefined }); }
      return { prefixes: [...prefixes].sort(), objects, truncated: false, next: "" }; }
    case "objects PUT": { bucket(p.bucket); const list = DB.objects[p.bucket];
      const o = { key: p.key, size: opts.body?.size ?? 0, modified: Date.now() / 1000, etag: Math.random().toString(16).slice(2, 18), version: "null",
        encrypted: opts.encrypt || bucket(p.bucket).encrypted, storage_class: "STANDARD", replication: bucket(p.bucket).replication ? "COMPLETED" : "", body: opts.body || null };
      DB.objects[p.bucket] = list.filter(x => x.key !== p.key).concat(o); if (o.replication) DB.replicated++; return { etag: o.etag }; }
    case "objects DELETE": bucket(p.bucket); DB.objects[p.bucket] = DB.objects[p.bucket].filter(o => o.key !== p.key); return { ok: true };
    case "cluster GET": return demoCluster();
    case "healing GET": return { queue: 0, mrf: 0, drives: {}, recent: DB.recent };
    case "heal POST": { const n = (DB.objects[bucket(p.bucket).name] || []).length; return { bucket: p.bucket, prefix: "", scanned: n, healed: 0 }; }
    case "replication GET": { const pend = Object.values(DB.objects).flat().filter(o => o.replication === "PENDING").length;

      return { total: { queued_count: pend, queued_bytes: pend * 512, in_flight: 0, completed: DB.replicated, completed_bytes: DB.replicated * 900000, failed: 0,
        lag_seconds: pend ? 1.2 : 0, latency_p99: 0.84 }, nodes: [0, 1, 2, 3].map(node) }; }
    case "usage GET": return demoUsage();
    case "services GET": return { kms: { provider: "hashicorp-vault-transit", online: true, addr: "http://kms:8200 (demo)" }, keystone: { configured: true, online: true },

function route() {
  clearInterval(TIMER);
  if (!ME) return renderLogin();
  const id = (location.hash.match(/^#\/([\w-]+)/) || [])[1] || "buckets";
  let view = VIEWS.find(v => v.id === id && (!v.admin || ME.admin)) || VIEWS[0];
  if (!$(".app")) renderShell();  // (the login page also has a #main)
  $$(".side nav a").forEach(a => { if (a.dataset.v === view.id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const first = CURRENT !== view.id; CURRENT = view.id;
  document.title = view.label + " · Vault Console";
  $("#live-toggle").hidden = !view.live;
  show(view, first);
  if (view.live) TIMER = setInterval(() => { const m = $("#main"), a = document.activeElement;
    if (PREFS.live && m && (!m.contains(a) || a === m)) show(view, false, true); }, 5000);

async function show(view, focusHeading, quiet = false) {
  const main = $("#main");
  main.setAttribute("aria-busy", "true");
  try { await view.fn(main); }
  catch (e) { main.innerHTML = `<h1 id="page-title">${esc(view.label)}</h1><div class="card" role="alert">${icon("alert")} ${esc(e.message)}</div>`; }
  finally { main.removeAttribute("aria-busy"); }
  if (focusHeading) { main.setAttribute("data-enter", ""); setTimeout(() => main.removeAttribute("data-enter"), 400); }
  if (focusHeading) { const h = $("#page-title"); if (h) { h.setAttribute("tabindex", "-1"); h.focus(); } announce(view.label + " page loaded"); }
}

function uploadOne(file, li) {
  if (DEMO) return demoUpload(file, li);
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest(), bar = li.querySelector("[role=progressbar]"), fill = bar.firstElementChild;
    x.open("PUT", "/vault/console/api/objects?" + q({ bucket: STATE.bucket, key: STATE.prefix + file.name }));
    x.setRequestHeader("x-content-type", file.type || "application/octet-stream");
    x.setRequestHeader("x-encrypt", $("#enc").checked ? "1" : "0");
    x.upload.onprogress = e => { if (e.lengthComputable) { const v = Math.round(e.loaded / e.total * 100);
      bar.setAttribute("aria-valuenow", v); bar.setAttribute("aria-valuetext", v + "%"); fill.style.width = v + "%"; } };
    x.onload = () => x.status < 300 ? resolve() : reject(new Error((() => { try { return JSON.parse(x.responseText).message; } catch (e) { return "HTTP " + x.status; } })()));
    x.onerror = () => reject(new Error("Network error"));
    x.send(file);
  });
}
async function demoUpload(file, li) {
  const bar = li.querySelector("[role=progressbar]"), fill = bar.firstElementChild;
  for (const v of [15, 40, 70, 100]) { await new Promise(r => setTimeout(r, 120));
    bar.setAttribute("aria-valuenow", v); bar.setAttribute("aria-valuetext", v + "%"); fill.style.width = v + "%"; }
  await demoApi("objects?" + q({ bucket: STATE.bucket, key: STATE.prefix + file.name }), { method: "PUT", body: file, encrypt: $("#enc").checked });
}
async function uploadAll(files, main) {
  if (!files.length) return;
  const list = $("#uploads");
  announce(`Uploading ${files.length} file${files.length > 1 ? "s" : ""}`);
  let ok = 0;
  for (const f of files) {
    const li = document.createElement("li");
    li.innerHTML = `<span class="mono">${esc(f.name)} <span class="hint">(${fmtB(f.size)})</span></span>${meter(0, "Upload progress for " + f.name)}<span class="st">${chip("Uploading", "info")}</span>`;
    list.appendChild(li);
    try { await uploadOne(f, li); ok++; li.querySelector(".st").innerHTML = chip("Done", "ok"); }
    catch (err) { li.querySelector(".st").innerHTML = chip("Failed", "bad"); toast(`${f.name}: ${err.message}`, true); }
  }
  toast(`${ok} of ${files.length} file${files.length > 1 ? "s" : ""} uploaded`);
  const keep = list.innerHTML; await vBrowser(main); $("#uploads").innerHTML = keep; $("#pick").focus();
}

    try { await api("users", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ access_key: $("#uak").value, secret_key: $("#usk").value, policies: [$("#upol").value] }) });
      toast("User " + $("#uak").value + " added"); await vUsers(main); $("#page-title").focus(); }
    catch (err) { $("#uak-err").textContent = err.message; announce(err.message, true); }
  };
  $$("[data-u]", main).forEach(b => b.onclick = async () => {
    if (!await confirmDialog("Remove user?", `Remove the user "${b.dataset.u}"? Their keys stop working immediately.`, "Remove user")) return;
    try { await api("users?" + q({ access_key: b.dataset.u }), { method: "DELETE" }); toast("User removed"); await vUsers(main); $("#page-title").focus(); }
    catch (err) { toast(err.message, true); }
  });
}

/* ----------------------------------------------------------- settings */
async function vSettings(main) {
  const opt = (name, value, label) => `<label style="display:flex;gap:.6rem;align-items:center;min-height:44px;font-weight:400"><input type="radio" name="${name}" value="${value}" ${String(PREFS[name]) === String(value) ? "checked" : ""} style="min-height:auto;width:1.2rem;height:1.2rem">${label}</label>`;
  main.innerHTML = `<div class="page-head"><div class="grow"><h1 id="page-title">Display settings</h1>
      <p class="sub">Saved in this browser. These add to your operating system's own accessibility settings.</p></div></div>
    <form class="settings" id="sf">
      <fieldset class="card"><legend><h2 style="margin:0">Theme</h2></legend>
        ${opt("theme", "system", "Match my system")}${opt("theme", "light", "Light")}${opt("theme", "dark", "Dark")}${opt("theme", "contrast", "High contrast (black and yellow)")}</fieldset>
      <fieldset class="card"><legend><h2 style="margin:0">Text size</h2></legend>
        ${opt("scale", 1, "Default (100%)")}${opt("scale", 1.125, "Large (112%)")}${opt("scale", 1.25, "Larger (125%)")}${opt("scale", 1.5, "Largest (150%)")}</fieldset>
      <fieldset class="card"><legend><h2 style="margin:0">Motion</h2></legend>
        ${opt("motion", "system", "Match my system")}${opt("motion", "reduce", "Reduce motion")}</fieldset>
      <fieldset class="card"><legend><h2 style="margin:0">Live updates</h2></legend>
        <p class="hint">Status pages refresh every 5 seconds. Refreshing pauses while focus is inside the page, so it never moves your place.</p>
        ${opt("live", true, "On")}${opt("live", false, "Paused")}</fieldset>
    </form>`;
  $("#sf").onchange = e => {
    const { name, value } = e.target;
    PREFS[name] = name === "scale" ? Number(value) : name === "live" ? value === "true" : value;
    applyPrefs(); const lt = $("#live-toggle"); if (lt) lt.setAttribute("aria-pressed", PREFS.live);
    announce("Setting saved: " + e.target.closest("label").textContent.trim());
  };
}

/* --------------------------------------------------------------- boot */
window.addEventListener("hashchange", route);
api("me").then(m => { ME = m; route(); }).catch(() => route());
</script>
