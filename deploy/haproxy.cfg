# Single S3 entry point in front of node1..node4.
# Active health checks: every node's /vault/health/ready is polled every second; a node that
# misses 2 checks (hung, paused, crashed, partitioned) stops receiving requests within ~2 s,
# instead of each request waiting for a timeout on it.
global
    maxconn 4096

defaults
    mode http
    timeout connect 3s
    timeout client 300s
    timeout server 300s            # large objects stream for a long time
    timeout http-request 60s
    timeout check 1s
    retries 2                      # retry connection failures on another node
    option redispatch
    option http-server-close
    option forwardfor              # X-Forwarded-For (aws:SourceIp); Host is passed unchanged for SigV4

frontend s3
    bind :9000
    default_backend vault

backend vault
    balance leastconn
    option httpchk GET /vault/health/ready
    http-check expect status 200
    default-server check inter 1s fastinter 500ms downinter 2s fall 2 rise 2 maxconn 1024
    server node1 node1:9000 init-addr last,libc,none resolvers docker
    server node2 node2:9000 init-addr last,libc,none resolvers docker
    server node3 node3:9000 init-addr last,libc,none resolvers docker
    server node4 node4:9000 init-addr last,libc,none resolvers docker

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

frontend stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 2s
