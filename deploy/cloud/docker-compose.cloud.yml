# Public-server overlay for deploy/docker-compose.yml.
#   docker compose -f deploy/docker-compose.yml -f deploy/cloud/docker-compose.cloud.yml \
#       --env-file deploy/cloud/.env up -d --build
# Only Caddy is reachable from the internet (80 -> HTTPS redirect, 443 -> S3 API + console).
# Every internal service (HashiCorp Vault, Keystone, Kafka, Grafana, the nodes...) is
# unpublished and reachable only on the private Docker network.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/cloud/.env}
    volumes:
      - ./cloud/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [lb]

  lb: { ports: !reset [] }
  node1: { ports: !reset [] }
  node2: { ports: !reset [] }
  node3: { ports: !reset [] }
  node4: { ports: !reset [] }
  kms: { ports: !reset [] }
  keystone: { ports: !reset [] }
  remote-s3: { ports: !reset [] }
  kafka: { ports: !reset [] }
  webhook: { ports: !reset [] }
  prometheus: { ports: !reset [] }
  grafana:
    ports: !reset []
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "false", GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}" }

volumes:
  caddy_data: {}
  caddy_config: {}
