[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "vault"
version = "0.1.0"
requires-python = ">=3.12"
description = "Fault-tolerant, S3-compatible distributed object storage (Python + C++)"
dependencies = [
  "starlette>=0.37", "uvicorn[standard]>=0.30", "grpcio==1.76.0", "grpcio-tools==1.76.0",
  "msgpack>=1.0", "pydantic>=2", "pyyaml>=6", "structlog>=24", "prometheus-client>=0.20",
  "httpx>=0.27", "boto3>=1.34", "aiokafka>=0.10", "cryptography>=42", "defusedxml>=0.7",
  "pyjwt[crypto]>=2.8", "numpy>=1.26", "blake3>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6"]

[project.scripts]
vaultctl = "vault.admin.vaultctl:main"

[tool.scikit-build]
cmake.source-dir = "native"
wheel.packages = ["vault"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
